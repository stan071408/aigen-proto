<!-- AIGenPlatform 整体原型 B「顶栏导航」 v0.1.0（2026-11-11 北京时间）。单文件、离线可用；页面数据均为示例数据。 -->
<style>:root{--bg:#f1f6fc;--paper:#fff;--ink:#14213a;--muted:#596579;--faint:#8592a6;--line:#d9e3f0;--line2:#e8eef7;--accent:#1c5fc4;--accent-d:#164ea3;--soft:#e3edfc;--soft2:#f5f9fe;--navy:#0f2348;--navy2:#16305e;--green:#17734a;--green-bg:#e3f4ea;--amber:#8f5600;--amber-bg:#fdf0d9;--red:#b3262f;--red-bg:#fbe7e8;--purple:#5b3fb5;--purple-bg:#eeeafc;--gray:#5d6878;--gray-bg:#edf1f6;--radius:14px;--shadow:0 6px 24px #12305c0f;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled,[aria-disabled=true]{cursor:not-allowed}
h1,h2,h3,h4,p{margin:0}a{color:var(--accent)}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;line-height:1.3;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover:not(:disabled){background:var(--accent-d);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover:not(:disabled){background:var(--soft)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}.btn.danger{color:var(--red)}.btn.danger:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.btn.lg{padding:10px 18px;font-size:14px;border-radius:10px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;font-size:13px}
.input:focus{outline:2px solid #1c5fc426;border-color:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.card-h h3{font-size:14.5px;font-weight:600}.card-h .sub{color:var(--muted);font-size:12px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.mono{font-family:var(--mono);font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:20px;font-size:11.5px;line-height:19px;white-space:nowrap;background:var(--gray-bg);color:var(--gray);border:1px solid transparent}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.tag.blue{background:var(--soft);color:var(--accent)}.tag.green{background:var(--green-bg);color:var(--green)}.tag.amber{background:var(--amber-bg);color:var(--amber)}.tag.red{background:var(--red-bg);color:var(--red)}.tag.purple{background:var(--purple-bg);color:var(--purple)}.tag.line{background:#fff;border-color:var(--line);color:var(--muted)}
.tag.tbd{background:#fff;border:1px dashed #c3a15a;color:var(--amber)}
.code{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:4px}
.demo-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--amber);background:var(--amber-bg);border-radius:20px;padding:2px 10px;white-space:nowrap}
.demo-chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.local-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--green);background:var(--green-bg);border-radius:20px;padding:2px 10px;white-space:nowrap}
.local-chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bar{height:6px;border-radius:6px;background:var(--line2);overflow:hidden}.bar>b{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.bar.green>b{background:#2a8a5c}.bar.amber>b{background:#d58a12}.bar.red>b{background:#c9404a}.bar.purple>b{background:#7a5fd6}
.table{width:100%;border-collapse:collapse;font-size:12.5px}.table th{font-weight:500;color:var(--muted);text-align:left;font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft2)}
.table td.mono{white-space:nowrap}.table td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}.table tr:last-child td{border-bottom:0}
.table tr.click{cursor:pointer}.table tr.click:hover td{background:#f7faff}
.table .t{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.tbl-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;font-size:12px;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}.chip b{font-weight:600;margin-left:3px}.chip:disabled{opacity:.5}
.seg{display:inline-flex;background:var(--soft2);border:1px solid var(--line);border-radius:9px;padding:2px}.seg button{border:0;background:transparent;padding:5px 13px;border-radius:7px;font-size:12.5px;color:var(--muted)}.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px #12305c1f;font-weight:500}.seg button:disabled{opacity:.45}
.switch{position:relative;width:34px;height:19px;border-radius:20px;background:#c9d3e1;border:0;padding:0;flex:none}.switch:after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}.switch[aria-checked=true]{background:var(--accent)}.switch[aria-checked=true]:after{left:17px}.switch:disabled{opacity:.5}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0;text-align:left}.kpi small{color:var(--muted);font-size:12px;display:block}.kpi b{display:block;font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.3;margin-top:2px}.kpi span{font-size:11.5px;color:var(--faint)}
.kpi.warn b{color:var(--purple)}.kpi.bad b{color:var(--red)}.kpi.ok b{color:var(--green)}
button.kpi{cursor:pointer;font:inherit;color:inherit}button.kpi:hover{border-color:var(--accent)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}.page-h h1{font-size:21px;font-weight:600;letter-spacing:-.3px}.page-h p{color:var(--muted);margin-top:3px;font-size:12.5px}.eyebrow{font-size:10.5px;letter-spacing:1.6px;color:var(--accent);margin-bottom:4px;text-transform:uppercase}
.todo{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff}.todo+.todo{margin-top:8px}.todo .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex:none}
.todo .ic.purple{background:var(--purple-bg);color:var(--purple)}.todo .ic.red{background:var(--red-bg);color:var(--red)}.todo .ic.amber{background:var(--amber-bg);color:var(--amber)}.todo .ic.blue{background:var(--soft);color:var(--accent)}
.todo .tx{flex:1;min-width:0}.todo .tx b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.todo .tx small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{border-radius:10px;padding:9px 12px;font-size:12px;background:var(--soft2);border:1px solid var(--line);color:var(--muted)}.note.amber{background:var(--amber-bg);border-color:#f1d9a8;color:var(--amber)}.note.red{background:var(--red-bg);border-color:#f2c4c7;color:var(--red)}.note.blue{background:var(--soft);border-color:#c8daf6;color:var(--accent-d)}
.empty{padding:28px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:#0f234833;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:#fff;z-index:61;box-shadow:-10px 0 40px #12305c26;transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column}.drawer.on{transform:none}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.drawer-h h3{font-size:16px;font-weight:600}.drawer-b{padding:16px 20px;overflow:auto;flex:1}.drawer-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:12.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.stages{list-style:none;padding:0;margin:0}.stages li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;position:relative}.stages li .d{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;background:var(--gray-bg);color:var(--gray);border:1px solid var(--line)}
.stages li.done .d{background:var(--green-bg);color:var(--green);border-color:#bfe3cd}.stages li.cur .d{background:var(--accent);color:#fff;border-color:var(--accent)}.stages li.wait .d{background:var(--purple-bg);color:var(--purple);border-color:#d6ccf5}.stages li.bad .d{background:var(--red-bg);color:var(--red);border-color:#f2c4c7}.stages li.skip .d{border-style:dashed}
.events{list-style:none;margin:0;padding:0;font-size:12px;border-left:2px solid var(--line);padding-left:12px}.events li{padding:3px 0}.events time{font-family:var(--mono);font-size:11px;color:var(--faint);margin-right:8px}
dialog.modal{border:0;border-radius:16px;padding:0;width:min(460px,92vw);box-shadow:0 20px 60px #12305c33;color:var(--ink)}dialog.modal::backdrop{background:#0f234840}.modal-h{padding:16px 20px 6px;font-size:16px;font-weight:600}.modal-b{padding:6px 20px 14px;font-size:13px;color:var(--muted)}.modal-f{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;background:#12264a;color:#fff;border-radius:9px;padding:10px 18px;font-size:12.5px;box-shadow:0 8px 30px #12305c33;max-width:80vw;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
/* images */
.ph{aspect-ratio:4/3;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(135deg,#cfe0fb,#eaf2ff 55%,#d7e6fd);display:flex;align-items:flex-end;padding:8px}.ph span{font-size:11px;background:#ffffffd9;border-radius:6px;padding:1px 7px;color:var(--muted)}

.cal{display:grid;grid-template-columns:64px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;font-size:11.5px}
.cal>div{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px;min-height:58px;min-width:0}.cal .hd{min-height:auto;background:var(--soft2);color:var(--muted);text-align:center;font-weight:500}.cal .hd.today{color:var(--accent)}.cal .tm{color:var(--muted);font-family:var(--mono);font-size:11px;background:var(--soft2)}

/* forms in settings */
.set-sec{margin-bottom:16px}.set-row{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line2);align-items:center}.set-row:last-child{border-bottom:0}.set-row label,.set-row .lb{font-weight:500}.set-row small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.num{width:84px}.lock{color:var(--faint);font-size:11.5px}

.embed-wrap{display:flex;flex-direction:column;height:100%;min-height:0}.embed-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.embed-bar b{color:var(--ink);font-weight:600;font-size:13.5px}

.hot-stepper button.done .n{background:var(--green-bg);border-color:#bfe3cd;color:var(--green)}.hot-stepper button.cur{background:var(--soft);color:var(--accent)}.hot-stepper button.cur .n{background:var(--accent);border-color:var(--accent);color:#fff}
.hot-stepper button:disabled{opacity:.5}.hot-stepper button:hover:not(:disabled){background:var(--soft2)}
.hsec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;scroll-margin-top:64px}.hsec-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.hsec-h .k{font-size:10.5px;letter-spacing:1.6px;color:var(--accent)}.hsec-h h2{font-size:17px;font-weight:600;margin-top:2px}.hsec-h p{color:var(--muted);font-size:12.5px;margin-top:2px}

.plogo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#e9452f;color:#fff;font-weight:700;font-size:13px;flex:none}.plogo.bd{background:#2a5ed8}.platform small{display:block;color:var(--muted);font-size:11px}
.fld{margin-bottom:14px}.fld-l{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:500;color:#3b4a63;margin-bottom:6px}.fld-l .opt{font-weight:400;color:var(--faint)}
.count{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}.count button{border:0;background:var(--soft2);width:30px;font-size:15px}.count input{width:54px;border:0;text-align:center;padding:6px 0;-moz-appearance:textfield}.count input::-webkit-inner-spin-button{display:none}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:11.5px;color:var(--muted);align-items:center}
.hot-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}.side-guide{background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12px}.side-guide h4{font-size:12.5px;margin-bottom:8px}.gl{display:flex;gap:8px;margin-bottom:10px}.gl .gi{font-family:var(--mono);color:var(--accent);font-size:11px;padding-top:1px}.gl p{color:var(--muted);margin-top:1px}.gl.on b{color:var(--accent)}

.titles{display:grid;gap:8px}.topt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;background:#fff}.topt:has(input:checked){border-color:var(--accent);background:var(--soft2);box-shadow:inset 3px 0 0 var(--accent)}.topt input{margin-top:4px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}.tabs button{border:0;background:transparent;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13px}.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}.tabs button:disabled{opacity:.5}
.cand{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line2);border-radius:9px;margin-top:6px;cursor:pointer}.cand:has(input:checked){border-color:var(--accent);background:var(--soft2)}
details.pv{margin-top:10px;border:1px solid var(--line);border-radius:10px}details.pv summary{padding:8px 12px;cursor:pointer;color:var(--accent);font-size:12.5px}details.pv .body{padding:4px 16px 14px;font-size:13px;line-height:1.85;max-height:340px;overflow:auto}details.pv .body p{margin:8px 0}
.sk{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,#e8eef7,#f5f8fd,#e8eef7);background-size:200% 100%;animation:sk 1.2s infinite;margin:7px 0}@keyframes sk{to{background-position:-200% 0}}
.spin{width:12px;height:12px;border:2px solid #ffffff80;border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .8s linear infinite}.btn:not(.primary) .spin{border-color:#1c5fc440;border-top-color:var(--accent)}@keyframes sp{to{transform:rotate(360deg)}}
.hlog{list-style:none;margin:0;padding:0;max-height:150px;overflow:auto;font-size:12px}.hlog li{display:flex;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line2)}.hlog time{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none}
details.demo{border:1px dashed var(--line);border-radius:12px;padding:8px 14px;background:#fff;font-size:12px;color:var(--muted);margin-top:4px}details.demo summary{cursor:pointer}details.demo .dg{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:10px}details.demo label{display:block;font-size:11.5px;margin-bottom:3px}details.demo select{border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:#fff}

.sb{flex:none;background:var(--soft2);border-bottom:1px solid var(--line);height:44px;display:flex;align-items:center;gap:16px;padding:0 24px}
.crumb{font-size:12px;color:var(--faint);white-space:nowrap}.crumb b{color:var(--ink);font-weight:500}
.subtabs{display:flex;gap:4px}.st{border:1px solid transparent;background:none;border-radius:8px;padding:4px 12px;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}.st.active{background:#fff;border-color:var(--line);color:var(--accent);font-weight:500}.st:disabled{opacity:.55;cursor:not-allowed}.st:hover:not(:disabled):not(.active){color:var(--ink)}
#view{flex:1;overflow:auto;min-height:0}#view.embed{overflow:hidden}.page-pad{max-width:1180px;margin:0 auto;padding:26px 28px 44px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}.hero h1{font-size:26px;font-weight:600;letter-spacing:-.5px}.hero p{color:var(--muted);margin-top:4px}
.entry.big{padding:24px;min-height:208px}.entry.big h3{font-size:18px}

function openJob(id){const j=JOBS.find(x=>x.id===id);if(!j)return;const w=WAITING.includes(j.status);

function defaultEvents(j){const t=j.created.slice(6);const ev=[[t,'任务创建 · queued'],[t,'开始执行 · running']];if(j.progress>15)ev.push([t,'写稿完成']);if(j.stage>=3&&j.progress>30)ev.push([t,'进入配图阶段（豆包按张计数）']);if(j.status!=='running'&&j.status!=='queued')ev.push([t,JS[j.status][0]+' · '+j.status+(j.note?' · '+j.note:'')]);if(j.status==='queued')return [[t,'任务创建 · queued']];return ev}

function imgCell(c,k,i){const bad=(c.bad||[]).includes(k);const key=c.id+'-'+k;return `<div class="img-cell"><div class="ph ${phCls(i)} ${REGEN[key]?'regen':''}" style="${bad?'background:repeating-linear-gradient(45deg,#fbe7e8,#fbe7e8 8px,#fff 8px,#fff 16px)':''}"><span>点位 ${k}${bad?' · 被拒':''}</span></div><div class="row between"><span class="faint" title="${esc(c.title)}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px">${c.id}</span><button class="btn sm" ${REGEN[key]?'disabled':''} onclick="event.stopPropagation();regen('${c.id}',${k})">${REGEN[key]?'生成中':'重新生成'}</button></div></div>`}

openDrawer(`<div class="drawer-h"><div><div class="mono faint">${c.id} · 图文 · ${pipeName(c.pipe)}</div><h3>${esc(c.title)}</h3><div class="row" style="margin-top:6px"><span class="tag blue">${c.status}</span>${demoNote()}</div></div><button class="btn ghost" onclick="closeDrawer()" aria-label="关闭">✕</button></div>
<div class="drawer-b"><dl class="kv"><dt>字数</dt><dd>${c.words}</dd><dt>生成时间</dt><dd class="mono">${c.date}（北京时间）</dd><dt>产物</dt><dd class="row" style="gap:4px">${c.arts.map(a=>`<button class="btn sm" onclick="toast('原型不生成真实文件（示例）')">${a}</button>`).join('')}</dd></dl>
${c.bad?`<div class="note red" style="margin-top:12px">${c.bad.length} 张配图被拒（不重试、不换号）。可单张重新生成。</div>`:''}

<h4 style="margin:16px 0 6px;font-size:13px">正文预览</h4><div class="note" style="line-height:1.8;color:var(--ink)">围绕「${esc(c.title)}」展开。以下为原型示例正文，不代表真实生成内容……</div></div>
<div class="drawer-f"><button class="btn" onclick="toast('已复制到剪贴板（示例）')">复制正文</button><button class="btn primary" onclick="closeDrawer();go('publish');setTimeout(()=>newPublish('${c.id}'),50)">发布 / 排期</button></div>`);$('#drawer').dataset.cid=id}

<p class="faint" style="margin-top:8px;font-size:11.5px">发布状态：draft → scheduled → publishing → published / retrying（7050 回退）→ needs_manual / failed。头条多账号串行发布，账号间随机间隔 30–40 秒。</p>`}

return `<div class="page-h"><div><div class="eyebrow">Publish & Schedule</div><h1>发布中心</h1><p>渠道能力、立即 / 定时发布、排期点位、失败重试与人工处理。</p></div><div class="row">${demoNote()}<button class="btn primary" onclick="newPublish()">+ 新建发布</button></div></div>
<div class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:14px"><div class="kpi ok"><small>今日已发布</small><b>${s.published}</b></div><div class="kpi"><small>已排期</small><b>${s.sched}</b></div><div class="kpi"><small>发布中 / 重试中</small><b>${PUBS.filter(p=>p.status==='publishing').length} / ${s.retrying}</b></div><button class="kpi bad" onclick="PF.tab='list';PF.status='needs_manual';render()"><small>需人工处理</small><b>${s.manual}</b></button><button class="kpi bad" onclick="PF.tab='list';PF.status='failed';render()"><small>发布失败</small><b>${s.pubFail}</b></button></div>
<div style="margin-bottom:12px">${tabs}</div>${body}`}
function pubActs(p){if(p.ch==='wechat_p')return '<span class="tag tbd">待定</span>';return {draft:`<button class="btn sm primary" onclick="pubNow('${p.id}')">立即发布</button> <button class="btn sm" onclick="newPublish(null,'${p.id}')">定时</button>`,scheduled:`<button class="btn sm" onclick="unsched('${p.id}')">取消排期</button>`,needs_manual:`<button class="btn sm primary" onclick="manualPub('${p.id}')">去处理</button>`,failed:`<button class="btn sm primary" onclick="retryPub('${p.id}')">重试</button>`,retrying:'<span class="faint">自动回退中</span>',publishing:'<span class="faint">执行中</span>',published:`<button class="btn sm" onclick="toast('打开平台文章页（示例）')">查看</button>`}[p.status]||''}
function pubNow(id){const p=PUBS.find(x=>x.id===id);p.status='publishing';p.mode='立即';p.at=bjNow().slice(5,16);if(p.acct==='—')p.acct='城市观察笔记';toast(p.id+' 进入发布队列（串行，间隔 30–40 秒，示例）');render();setTimeout(()=>{p.status='published';render()},2200)}
