<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SAMPLES={
  topic:['三国野史里最被低估的五场战役','如果诸葛亮多活十年，三国格局会怎样','曹操的用人之道，放在今天还成立吗','三国时期的普通人，一天是怎么过的','刘备借荆州，真的是赖着不还吗'],
  hot:['年轻人为什么开始重新关注社区生活','社区食堂如何留住居民','老旧小区加装电梯，居民最关心哪些问题','城市绿道建成后，周边生活有哪些变化','越来越多家庭重新使用公共空间']
};
const HOT_LIST=[
 {rank:1,title:'年轻人为什么开始重新关注社区生活'},
 {rank:2,title:'社区食堂如何留住居民'},
 {rank:3,title:'老旧小区加装电梯，居民最关心哪些问题'},
 {rank:4,title:'城市绿道建成后，周边生活有哪些变化'},
 {rank:5,title:'越来越多家庭重新使用公共空间'},
 {rank:6,title:'县域公共服务如何走进日常生活'},
 {rank:7,title:'周末短途游为什么越来越受欢迎'},
 {rank:8,title:'社区图书馆如何留住读者'}
];
function parseRanks(){return [...new Set(String(S.ranks).split(/[,，\s]+/).map(x=>parseInt(x,10)).filter(n=>Number.isFinite(n)&&n>0))].slice(0,20)}
function genCandidates(){
  if(S.source==='direct'){S.candidates=[];S.selected=[];return}
  let list=[];
  if(S.source==='topic'){
    list=SAMPLES.topic.slice(0,S.titleCount).map((t,i)=>({id:'t'+i,text:t,meta:'主题生成'}));
  }else{
    const dir=S.hotDir.trim();
    if(dir){
      list=HOT_LIST.slice(0,S.titleCount).map(x=>({id:'hm'+x.rank,text:x.title,meta:'今日榜单 · 匹配'}));
    }else{
      const ranks=parseRanks();
      if(ranks.length){
        list=ranks.map(n=>{const it=HOT_LIST[(n-1)%HOT_LIST.length];return {id:'r'+n,text:it.title,meta:'第 '+n+' 名'}});
      }else{
        list=HOT_LIST.slice(0,S.titleCount).map(x=>({id:'a'+x.rank,text:x.title,meta:'第 '+x.rank+' 名'}));
      }
    }
  }
  S.candidates=list;S.selected=list.map(c=>c.id);S.err='';
  S.rankHidden=S.source==='hot';S.rankEdited=false;S.exportSel=null;
  render();
}
function resetStep(){
  S.topic='';S.hotDir='';S.ranks='';S.title='';S.titleCount=5;S.candidates=[];S.selected=[];
  S.rankHidden=false;S.rankEdited=false;S.deepOn=false;S.exportSel=null;S.err='';render();
}
function hideCandWrap(){const el=document.getElementById('candWrap');if(el)el.style.display='none'}
function toggleAll(on){S.selected=on?S.candidates.map(c=>c.id):[];S.exportSel=null;render()}
function toggleCand(id,on){if(on){if(!S.selected.includes(id))S.selected.push(id)}else S.selected=S.selected.filter(x=>x!==id);S.exportSel=null;render()}
function selTitles(){
  if(S.source==='direct')return S.title.trim()?[S.title.trim()]:[];
  return S.candidates.filter(c=>S.selected.includes(c.id)).map(c=>c.text);
}
const S={source:'topic',topic:'三国野史',hotDir:'',ranks:'',title:'',titleCount:5,candidates:[],selected:[],rankHidden:false,rankEdited:false,deepOn:false,deai:true,ideaCount:3,style:'清晰克制',drafts:true,mergeDrafts:true,pickDiff:true,pickBroad:true,pickDeep:true,minWords:1000,maxWords:1200,bodyImgs:5,exportSel:null,showTaskList:false,step:0,max:0,cycle:'daily',when:'07:30',weekday:'周一',formats:['word'],err:''};
const FIXED={imgMode:'API',cover:1,toLib:true};
const STEPS=[
  {k:'title',n:'01',t:'标题设定',d:'选来源并勾选要生成的文章。'},
  {k:'orig',n:'02',t:'原稿设定',d:'设定原稿参数，后台触发。'},
  {k:'deep',n:'03',t:'深度加工（可选）',d:'核心立意、写作风格、三稿与合稿。'},
  {k:'image',n:'04',t:'图文生成',d:'为稿件生成封面与正文配图。'},
  {k:'schedule',n:'05',t:'执行周期',d:'导出格式与执行时间。'}
];
function allDraftPicked(){return S.pickDiff&&S.pickBroad&&S.pickDeep}
function draftNames(){return [S.pickDiff&&'差异化稿',S.pickBroad&&'广度稿',S.pickDeep&&'深度稿'].filter(Boolean)}
function toggleDraft(name){S[name]=!S[name];if(!allDraftPicked())S.mergeDrafts=false;render()}
function guideSubs(){
  const subs=[
    {k:'3.1',t:'核心立意',d:S.ideaCount+' 条'},
    {k:'3.2',t:'写作风格',d:'「'+S.style+'」'},
    {k:'3.3',t:'生成三稿',d:S.drafts?'全部三稿':(draftNames().join('、')||'未选择')}
  ];
  if(S.drafts||allDraftPicked())subs.push({k:'3.4',t:'三稿合稿',d:S.mergeDrafts?'生成合并稿':'不合稿'});
  return subs;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2000)}
function setSource(k){S.source=k;S.candidates=[];S.selected=[];S.rankHidden=false;S.rankEdited=false;S.exportSel=null;S.err='';render()}
function picked(){const a=selTitles();return a[0]||''}
function goStep(i){if(i<=S.max){S.step=i;S.err='';render();scrollTop()}}
function jump(i){S.step=i;S.max=Math.max(S.max,i);S.err='';render();scrollTop()}
function enableDeep(){S.deepOn=true;jump(2)}
function next(){
  if(S.step===0){
    if(S.source==='direct'){
      if(!S.title.trim()){S.err='请填写指定文章标题';render();return}
    }else{
      if(!S.candidates.length){S.err='请先获取候选标题';render();return}
      if(!S.selected.length){S.err='请至少勾选 1 条候选标题';render();return}
    }
  }
  if(S.step>=STEPS.length-1){save();return}
  S.step++;S.max=Math.max(S.max,S.step);S.err='';render();scrollTop();
}
function prev(){if(S.step>0){S.step--;S.err='';render();scrollTop()}}
function scrollTop(){const w=document.getElementById('ws');if(w)w.scrollTo({top:0,behavior:'smooth'})}
function save(){toast('已保存并启用：共 '+selTitles().length+' 篇（示例）')}
function guideHTML(){
  return STEPS.map((s,i)=>{
    const cur=i===S.step,done=i<S.step,lock=i>S.max;
    let sub='';
    if(s.k==='deep'&&S.deepOn){
      sub='<div class="gsub">'+guideSubs().map(x=>`<div class="gstep ${i<S.step?'done':''} ${i>S.max?'lock':''}"><span class="gn">${x.k}</span><span class="gt"><b>${x.t}</b><small>${x.d}</small></span></div>`).join('')+'</div>';
    }
    return `<button type="button" class="gstep ${cur?'cur':''} ${done?'done':''} ${lock?'lock':''}" onclick="goStep(${i})"><span class="gn">${done?'✓':s.n}</span><span class="gt"><b>${s.t}</b><small>${s.d}</small></span></button>${sub}`;
  }).join('');
}
function lockedRow(title,desc,val,tag){
  return `<div class="locked"><span class="lk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span class="lt"><b>${title}</b><small>${desc}</small></span><span class="lv">${val}</span><span class="tag-fixed">固定</span></div>`;
}
function stepHead(k,t,sub){return ''}
function titleStep(){
  const isDirect=S.source==='direct',hot=S.source==='hot',gen=S.candidates.length>0;
  const nSel=S.selected.length,nAll=S.candidates.length;
  const countCtl=`<span style="display:inline-flex;align-items:center;gap:8px"><span class="lbl" style="margin:0">生成标题数</span><input class="num" style="width:84px" type="number" min="1" max="10" value="${S.titleCount}" onchange="S.titleCount=Math.max(1,Math.min(10,+this.value||1));render()"><span class="unit">个</span></span>`;
  const fetchLabel=gen?'重新获取候选标题':'获取候选标题';
  return stepHead('title','标题设定','选来源并勾选要生成的文章；定时执行时按这里的设定在后台生成。')
  +`<div class="set-card">
      <div class="field"><label class="lbl">来源</label>
        <div class="src-row"><div class="seg" role="radiogroup">${[['topic','主题生成'],['hot','热榜生成'],['direct','自定标题']].map(([k,l])=>`<button type="button" class="${S.source===k?'on':''}" onclick="setSource('${k}')">${l}</button>`).join('')}</div><button class="btn ghost" type="button" onclick="resetStep()">重置</button></div>
      </div>
      ${isDirect
        ? `<div class="field ${S.err?'err':''}"><label class="lbl">指定文章标题</label><input class="input" id="fTitle" value="${esc(S.title)}" placeholder="例如：社区食堂如何留住居民" oninput="S.title=this.value"><div class="hint" style="margin-top:6px">设定好后直接进入第 2 步「原稿设定」。</div><div class="err-msg" ${S.err?'':'hidden'}>${esc(S.err)}</div></div>`
        : hot
          ? `<div class="field ${S.err?'err':''}">
              <div class="field-head"><label class="lbl">热榜主题方向（可空）</label>${countCtl}</div>
              <div class="input-row"><input class="input" id="fTopic" value="${esc(S.hotDir)}" placeholder="例如：三国野史，那么将根据三国野史方向搜寻榜单类似主题方向标题；不填写那么获取所有" oninput="S.hotDir=this.value"><button class="btn primary" type="button" onclick="genCandidates()">${fetchLabel}</button></div>
            </div>
            ${S.rankHidden?'':`<div class="field" style="margin-bottom:0">
              <label class="lbl">榜单排名号</label>
              <input class="input" id="fRanks" value="${esc(S.ranks)}" placeholder="例如：1,5,14；那么按榜单第 1、5、14 名取原标题；填几个排名就生成几条候选。" oninput="S.ranks=this.value;S.rankEdited=true;hideCandWrap()">
              <div class="hint" style="margin-top:6px">按“主题方向”匹配榜单原标题（今日数据），找到关联的榜单原标题根据指定排名生成；也可以不指定主题方向，那么获取所有榜单标题数据，然后根据指定“榜单排名号”生成。你也可以指定“主题方向”匹配榜单标题（今日数据），选定匹配榜单标题生成（“榜单排名号”就无效了）。</div>
              <div class="err-msg" ${S.err?'':'hidden'}>${esc(S.err)}</div>
            </div>`}`
          : `<div class="field ${S.err?'err':''}">
              <div class="field-head"><label class="lbl">想写的主题</label>${countCtl}</div>
              <div class="input-row"><input class="input" id="fTopic" value="${esc(S.topic)}" placeholder="例如：三国野史" oninput="S.topic=this.value"><button class="btn primary" type="button" onclick="genCandidates()">${fetchLabel}</button></div>
              <div class="err-msg" ${S.err?'':'hidden'}>${esc(S.err)}</div>
            </div>`}
    </div>
    ${isDirect?'':`<div id="candWrap" style="${S.rankEdited?'display:none':''}"><div class="log-line">${gen?`已获取 ${nAll} 条候选标题`:'点击「获取候选标题」后在这里勾选'}</div>
    <div class="result"><div class="result-h"><b>候选标题</b><span class="selbar">${gen?`已选 ${nSel} / ${nAll} 篇 <button type="button" class="linkbtn" onclick="toggleAll(${nSel!==nAll})">${nSel===nAll?'取消全选':'全选'}</button>`:'待获取'}</span></div>
      <div class="result-b">${gen
        ? `<div class="cands" style="width:100%;text-align:left">${S.candidates.map((c,i)=>`<label class="cand ${S.selected.includes(c.id)?'on':''}"><input type="checkbox" class="chk" ${S.selected.includes(c.id)?'checked':''} onchange="toggleCand('${c.id}',this.checked)"><span class="idx">${i+1}</span><span>${esc(c.text)}</span><span class="pick">${esc(c.meta)}</span></label>`).join('')}</div>`
        : `<div><span class="sym">◇</span><b>候选标题将在这里展示</b>写好${hot?'热榜主题方向或榜单排名号':'主题'}后，点「获取候选标题」。</div>`}</div>
    </div></div>`}`;
}
function origStep(){
  const titles=selTitles(),n=titles.length;
  return stepHead('orig','原稿设定','设定原稿生成参数；定时执行时由后台触发，不需要现在生成。')
  +`<div class="set-card">
      <div class="field"><label class="lbl">本次将生成</label><div class="gencount"><b>${n}</b> 篇原稿</div></div>
      <div class="field"><label class="lbl">文章标题</label><div class="titlelist">${titles.map(t=>`<span class="tchip">${esc(t)}</span>`).join('')}</div></div>
      <div class="switch-row"><div class="sl"><b>去 AI 化</b><small>降低 AI 味，保留事实与信息密度</small></div><button class="switch" role="switch" aria-checked="${S.deai}" aria-label="去 AI 化" onclick="S.deai=!S.deai;render()"></button></div>
    </div>
    <div class="log-line">定时执行时按上面的设定在后台生成</div>`;
}
function deepStep(){
  return stepHead('deep','深度加工（可选）','已开启；设置立意数、写作风格与三稿处理。')
  +`<div class="set-card">
      <div class="field"><div class="field-head"><label class="lbl">核心立意</label><span class="hint" style="margin:0;font-size:11.5px;color:#8592a6">1–10 条</span></div><div style="display:flex;align-items:center;gap:8px"><input class="num" type="number" min="1" max="10" value="${S.ideaCount}" onchange="S.ideaCount=Math.max(1,Math.min(10,+this.value||1));render()"><span class="unit">条</span></div><div style="margin-top:6px;font-size:11.5px;color:#8592a6">根据每篇文章自动匹配核心立意</div></div>
      <div class="field"><label class="lbl">写作风格</label><input class="input" value="${esc(S.style)}" placeholder="例如：清晰克制" oninput="S.style=this.value;renderGuideOnly()"></div>
      <div class="switch-row"><div class="sl"><b>生成三稿</b><small>按标题、立意和风格生成三稿</small></div><button class="switch" role="switch" aria-checked="${S.drafts}" aria-label="生成三稿" onclick="S.drafts=!S.drafts;render()"></button></div>
      ${S.drafts?'':`
        <div class="draft-grid">
          <label class="draft ${S.pickDiff?'on':''}"><input type="checkbox" class="chk" ${S.pickDiff?'checked':''} onchange="toggleDraft('pickDiff')"><b>差异化稿</b><small>相似度方向：避开惯常叙事，寻找不同视角与内容增量。</small></label>
          <label class="draft ${S.pickBroad?'on':''}"><input type="checkbox" class="chk" ${S.pickBroad?'checked':''} onchange="toggleDraft('pickBroad')"><b>广度稿</b><small>拓展相关群体与观点，呈现信息边界、争议和限制。</small></label>
          <label class="draft ${S.pickDeep?'on':''}"><input type="checkbox" class="chk" ${S.pickDeep?'checked':''} onchange="toggleDraft('pickDeep')"><b>深度稿</b><small>追问底层逻辑与因果链，讨论结构性原因和长期影响。</small></label>
        </div>
        <div class="wordrow">每稿字数 <input class="num" style="width:84px" type="number" min="100" max="5000" value="${S.minWords}" onchange="S.minWords=Math.max(100,+this.value||100);render()"> — <input class="num" style="width:84px" type="number" min="100" max="5000" value="${S.maxWords}" onchange="S.maxWords=Math.max(100,+this.value||100);render()"> 字</div>
      `}
      ${(S.drafts||allDraftPicked())?`<div class="switch-row" style="margin-top:8px"><div class="sl"><b>三稿合稿</b><small>三稿合并成一篇合并稿</small></div><button class="switch" role="switch" aria-checked="${S.mergeDrafts}" aria-label="三稿合稿" onclick="S.mergeDrafts=!S.mergeDrafts;render()"></button></div>`:''}
    </div>
    <div class="log-line">深度加工已开启，参数可修改</div>`;
}
function renderGuideOnly(){const el=document.getElementById('gsteps');if(el)el.innerHTML=guideHTML()}

}
function toggleExp(i){const a=expSel();a[i]=!a[i];render()}
function expCount(){return expSel().filter(Boolean).length}
function outputCard(readonly){
  const titles=selTitles(),n=titles.length;
  return `<div class="result"><div class="result-h"><b>待生成文章</b><span>${readonly?n+' 篇':expCount()+' / '+n+' 篇'}</span></div>
    <div class="result-b" style="place-items:stretch;text-align:left;padding:10px 12px">
      <div class="cands">${titles.map((t,i)=>readonly
        ? `<div class="cand"><span class="idx">${i+1}</span><span>${esc(t)}</span><span class="pick">图文稿 · ${FIXED.cover+S.bodyImgs} 张图</span></div>`
        : `<label class="cand ${expSel()[i]?'on':''}"><input type="checkbox" class="chk" ${expSel()[i]?'checked':''} onchange="toggleExp(${i})"><span class="idx">${i+1}</span><span>${esc(t)}</span><span class="pick">${expSel()[i]?'导出':'不导出'}</span></label>`).join('')}</div>
      ${readonly?'':'<div class="hint" style="margin:8px 2px 0;font-size:11.5px;color:#8592a6">勾选要导出的文章；未勾选的不导出，但仍会生成并写入内容库。</div>'}
    </div></div>`;
}
function taskListHTML(){
  const titles=selTitles();
  return `<div class="task-list">${titles.map((t,i)=>`<label class="cand ${expSel()[i]?'on':''}"><input type="checkbox" class="chk" ${expSel()[i]?'checked':''} onchange="toggleExp(${i})"><span class="idx">${i+1}</span><span>${esc(t)}</span><span class="pick">${expSel()[i]?'导出':'不导出'}</span></label>`).join('')}</div>`;
}
function imageStep(){
  return stepHead('image','图文生成','为稿件生成封面与正文配图。')
  +`<div class="set-card">
      <div class="coverrow">
        <span class="lk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
        <div class="ct"><b>封面 + 配图</b><small>封面固定 1 张；正文配图 1–6 张</small></div>
        <div class="cright"><span class="tag-fixed">封面 1 张</span><input class="num" type="number" min="1" max="6" value="${S.bodyImgs}" onchange="S.bodyImgs=Math.max(1,Math.min(6,+this.value||1));render()"><span class="unit">张</span></div>
      </div>
    </div>`
  +outputCard(true);
}
function fmtNames(){const m={word:'Word（.docx）',md:'Markdown（.md）'};return S.formats.map(x=>m[x]).join('、')||'未选择'}
function toggleFmt(k,on){
  if(on){if(!S.formats.includes(k))S.formats.push(k)}
  else{S.formats=S.formats.filter(x=>x!==k);if(!S.formats.length){toast('至少保留一种导出格式');S.formats=[k]}}
  render();
}
function scheduleStep(){
  const cyc=S.cycle;
  const flow=['标题设定','原稿设定','深度加工（三稿/合稿）','图文生成','导出（'+S.formats.map(x=>x==='word'?'Word':'Markdown').join('/')+'）'];
  return stepHead('schedule','执行周期','导出格式与执行时间；保存后任务进入等待队列。')
  +`<div class="set-card">
      <div class="field"><label class="lbl">导出格式（可多选）</label>
        <div class="fmt-row">
          <label class="fmt ${S.formats.includes('word')?'on':''}"><input type="checkbox" ${S.formats.includes('word')?'checked':''} onchange="toggleFmt('word',this.checked)"><span class="ft"><b>Word（.docx）</b><small>适合继续编辑、投稿</small></span></label>
          <label class="fmt ${S.formats.includes('md')?'on':''}"><input type="checkbox" ${S.formats.includes('md')?'checked':''} onchange="toggleFmt('md',this.checked)"><span class="ft"><b>Markdown（.md）</b><small>适合公众号、站点发布</small></span></label>
        </div>
      </div>
    </div>`
  +`<div class="set-card" style="margin-top:10px">
      <div class="field"><label class="lbl">周期</label>
        <div class="seg" role="radiogroup">${[['once','单次'],['daily','每天'],['weekly','每周'],['custom','自定义']].map(([k,l])=>`<button type="button" class="${cyc===k?'on':''}" onclick="S.cycle='${k}';render()">${l}</button>`).join('')}</div>
      </div>
      <div class="field"><label class="lbl">${cyc==='once'?'执行时间':'执行时刻'}</label>
        ${cyc==='weekly'
          ? `<div class="field-head" style="justify-content:flex-start;gap:8px"><div class="seg" role="radiogroup">${[['周一','周一'],['周三','周三'],['周五','周五'],['周日','周日']].map(([k,l])=>`<button type="button" class="${S.weekday===k?'on':''}" onclick="S.weekday='${k}';render()">${l}</button>`).join('')}</div><input class="input" style="max-width:150px" value="${esc(S.when)}" placeholder="07:30" oninput="S.when=this.value"></div>`
          : `<input class="input" style="max-width:150px" value="${esc(S.when)}" placeholder="${cyc==='once'?'例如：2026-11-16 09:00':cyc==='custom'?'例如：每月 1 日 09:00':'07:30'}" oninput="S.when=this.value">`}
      </div>
    </div>
    <div class="log-line">保存后进入等待队列</div>
    <div class="summary" style="margin-top:10px">
      <div class="srow task-row" onclick="S.showTaskList=!S.showTaskList;render()"><span class="sk">任务</span><span class="sv">共 ${selTitles().length} 篇 · ${S.source==='topic'?'主题生成':S.source==='hot'?'热榜生成':'自定标题'}<span class="chev">${S.showTaskList?'▾':'▸'}</span></span></div>
      ${S.showTaskList?taskListHTML():''}
      <div class="srow" style="border-top:1px dashed #e2eaf5"><span class="sk">流程</span><span class="sv"><span class="flowline">${flow.map((x,i)=>`${i?'<span class="arr">›</span>':''}<span class="fstep">${esc(x)}</span>`).join('')}</span></span></div>
      <div class="srow"><span class="sk">参数</span><span class="sv">标题数 ${S.titleCount} 个 · 去AI化 ${S.deai?'开':'关'} · 立意 ${S.ideaCount} 条 · ${esc(S.style)} · 三稿 ${S.drafts?'全部生成':(draftNames().join('、')||'不生成')}${S.drafts?'':' · 每稿 '+S.minWords+'–'+S.maxWords+' 字'} · 合稿 ${(S.drafts||allDraftPicked())&&S.mergeDrafts?'生成':'不合稿'} · 生图 API · 封面 1 + 配图 ${S.bodyImgs}</span></div>
      <div class="srow"><span class="sk">导出</span><span class="sv">${expCount()} 篇 · ${fmtNames()}${FIXED.toLib?' · 同时写入内容库':''}</span></div>
      <div class="srow"><span class="sk">周期</span><span class="sv">${({once:'单次',daily:'每天',weekly:'每周 '+esc(S.weekday),custom:'自定义'})[cyc]} · ${esc(S.when)}</span></div>
    </div>`;
}
function actionsFor(k){
  const back=S.step>0?`<button class="btn ghost" type="button" onclick="prev()">上一步</button>`:'';
  if(k==='title')return `<div class="step-actions">${back}<button class="btn primary" type="button" onclick="next()">进入原稿设定</button></div>`;
  if(k==='orig')return `<div class="step-actions">${back}<button class="btn" type="button" onclick="jump(4)">开始定时执行</button><button class="btn" type="button" onclick="jump(3)">进入图文生成</button><button class="btn primary" type="button" onclick="enableDeep()">原稿深度加工</button></div>`;
  if(k==='deep')return `<div class="step-actions">${back}<button class="btn" type="button" onclick="jump(4)">开始定时执行</button><button class="btn primary" type="button" onclick="jump(3)">进入图文生成</button></div>`;
  if(k==='image')return `<div class="step-actions">${back}<button class="btn primary" type="button" onclick="jump(4)">下一步：执行周期</button></div>`;
  if(k==='schedule')return `<div class="step-actions">${back}<button class="btn primary" type="button" onclick="save()">保存并启用</button></div>`;
}
function render(){
  $('#gsteps').innerHTML=guideHTML();
  const fns={title:titleStep,orig:origStep,deep:deepStep,image:imageStep,schedule:scheduleStep};
  const k=STEPS[S.step].k;
  $('#stepArea').innerHTML=fns[k]()+actionsFor(k);
  const f=$('#fTopic')||$('#fTitle'); if(f&&S.err)f.focus();
}
render();
</script>
</body>
</html>
