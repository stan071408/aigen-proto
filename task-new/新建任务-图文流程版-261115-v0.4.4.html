<style>

.app{display:grid;grid-template-columns:auto minmax(0,1fr);height:100vh}

.wait-btn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 9px;font-size:11px;min-height:25px}
.demo-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#8f5600;background:#fdf0d9;border-radius:20px;padding:2px 9px;white-space:nowrap}

.ubtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px 3px 3px;font-size:12.5px;white-space:nowrap}
.ava{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#3d86ff,#1c5fc4);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.page{max-width:1340px;margin:0 auto;padding:14px 20px 16px}
.tlay{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:16px;align-items:start}
.canvas{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 22px 12px;display:flex;flex-direction:column;min-height:calc(100vh - 84px)}
.canvas-h .eyebrow{font-size:11.5px;letter-spacing:.06em;color:var(--accent);font-weight:600;margin-bottom:3px}
.canvas-h h1{margin:0;font-size:23px;letter-spacing:-.02em;line-height:1.25}
.canvas-h p{margin:3px 0 0;color:var(--muted);font-size:12px}
.step-area{margin-top:12px;display:flex;flex-direction:column;flex:1;min-height:0}
.step-kicker{font-size:12px;color:var(--faint);letter-spacing:.04em;margin-bottom:3px}
.step-title{margin:0 0 14px;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.35}

.set-card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 15px;box-shadow:0 2px 10px #12305c08}
.lbl{display:block;font-size:12px;color:#596579;margin-bottom:7px;font-weight:400}
.field{margin-bottom:10px}.field:last-child{margin-bottom:0}
.field-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px}

.input{width:100%;height:var(--ctl-h);border:2px solid var(--ctl-border);border-radius:12px;padding:0 12px;background:#fff;min-width:0;font-size:13px}
.input:focus{outline:0;border-color:var(--accent);box-shadow:var(--ring)}
.input::placeholder{color:#99a5b6}
.input:disabled{background:#e8edf3;color:#7a8699;border-color:#b7c2d1;cursor:not-allowed}
.input-row{display:flex;align-items:center;gap:10px}
.input-row .input{flex:1;min-width:0}
.input-row .btn{min-height:36px;flex:none}
.field.err .input{border-color:var(--red)}
.err-msg{margin:6px 0 0;font-size:12px;color:var(--red)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:#e6eef8;border-radius:10px;border:0}

.num{width:92px;height:var(--ctl-h);border:2px solid var(--ctl-border);border-radius:12px;padding:0 10px;background:#fff;font-size:13px;text-align:left}
.num:disabled{background:#e8edf3;color:#5b6b82;border-color:#b7c2d1}
.unit{font-size:12px;color:#596579}
.locked{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#f8fbff;border-radius:11px;padding:10px 12px}
.locked+.locked{margin-top:8px}
.locked .lk{width:28px;height:28px;border-radius:8px;background:#eef3fa;color:#7b8aa0;display:grid;place-items:center;flex:none}
.locked .lt{min-width:0;flex:1}.locked b{display:block;font-size:12.5px;font-weight:600}.locked small{display:block;font-size:11px;color:var(--faint);margin-top:1px}
.locked .lv{font-size:12.5px;color:#26344c;font-weight:600;white-space:nowrap}
.tag-fixed{font-size:10px;color:#5b6b82;background:#eef1f6;border-radius:999px;padding:0 7px;line-height:17px;white-space:nowrap}
.picked{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#f8fbff;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.picked .pt{min-width:0;flex:1}.picked b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmt-list{display:flex;flex-direction:column;gap:8px}
.fmt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;cursor:pointer}
.fmt.on{border-color:var(--accent);background:#f5f9ff}
.fmt input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid #b7c2d1;border-radius:5px;background:#fff;display:grid;place-items:center;margin:0;flex:none}
.fmt input:checked{background:var(--accent);border-color:var(--accent)}
.fmt input:checked:after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.fmt .ft{min-width:0;flex:1}.fmt b{display:block;font-size:13px;font-weight:600}.fmt small{display:block;font-size:11px;color:var(--faint)}
.tag-on{font-size:10px;color:var(--green);background:var(--green-bg);border-radius:999px;padding:0 7px;line-height:17px;white-space:nowrap}
.cands{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.cand{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:5px 10px;text-align:left;font-size:12.5px;color:#26344c;transition:border-color .15s,background .15s}
.cand:hover{border-color:#b9cce6;background:#f8fbff}

.cand.on{border-color:var(--accent);background:#f3f8ff;box-shadow:0 0 0 3px rgba(28,95,196,.08)}
.cand.on .idx{background:var(--accent);color:#fff}
.cand .pick{margin-left:auto;font-size:11.5px;color:var(--accent);white-space:nowrap}
.chk{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid #b7c2d1;border-radius:5px;background:#fff;display:grid;place-items:center;margin:0;flex:none}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked:after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.selbar{display:inline-flex;align-items:center;gap:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-size:11.5px;padding:0 2px;cursor:pointer;font-weight:500}
.gencount{font-size:13px;color:#26344c}.gencount b{font-size:20px;color:var(--accent);margin-right:2px}
.titlelist{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font-size:11.5px;color:#3c4c64;background:#f4f8fe;border:1px solid var(--line);border-radius:7px;padding:2px 8px;line-height:1.7}
.log-line{display:flex;align-items:center;gap:8px;margin:8px 2px 0;font-size:11.5px;color:var(--faint)}
.log-line:before{content:"";width:6px;height:6px;border-radius:50%;background:#c5ced8;flex:none}
.result{margin-top:8px;border:1px solid var(--line);background:#fbfdff;border-radius:14px;flex:1 0 auto;min-height:150px;display:flex;flex-direction:column;overflow:hidden}
.result-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--muted);background:#fff}
.result-h b{font-size:12.5px;color:var(--ink)}
.result-b{flex:1;display:grid;place-items:center;padding:14px;text-align:center;color:var(--faint);font-size:12px;line-height:1.8}
.result-b b{display:block;color:#5b6b82;font-size:13px;margin-bottom:4px}
.result-b .sym{font-size:20px;color:#c5d3e4;display:block;margin-bottom:6px}
.step-actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.src-row{display:flex;align-items:center;gap:10px}
.src-row .btn{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:12.5px;line-height:1.3;white-space:nowrap;min-height:34px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover:not(:disabled){background:var(--accent-d);border-color:var(--accent-d);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:8px;padding-right:8px}
.guide{position:sticky;top:62px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:15px 14px}
.guide-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px}
.guide-h b{font-size:14px;color:var(--accent)}
.guide-h small{font-size:10.5px;color:var(--faint)}
.guide-sub{font-size:11px;color:var(--faint);margin:0 0 12px}
.gsteps{display:flex;flex-direction:column;gap:7px}
.gstep{display:flex;gap:9px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 10px;transition:border-color .15s,background .15s}
.gstep:hover:not(.lock){border-color:#b9cce6}
.gstep .gn{width:22px;height:22px;border-radius:50%;background:#eef3fa;color:#7b8aa0;font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.gstep .gt{min-width:0}.gstep b{display:block;font-size:12px;font-weight:600}.gstep small{display:block;font-size:10.5px;color:var(--faint);line-height:1.5;margin-top:1px}
.gstep.cur{border-color:var(--accent);background:#f7faff;box-shadow:0 0 0 3px rgba(28,95,196,.08)}
.gstep.cur .gn{background:var(--accent);color:#fff}
.gstep.done .gn{background:var(--green-bg);color:var(--green)}
.gstep.done b{color:var(--green)}
.gstep.lock{opacity:.55;cursor:default}
.gsub{margin-left:31px;display:flex;flex-direction:column;gap:5px;padding:2px 0 2px 10px;border-left:1px dashed #dbe5f1}
.gsub .gstep{padding:7px 9px;border-radius:9px}
.gsub .gstep .gn{width:18px;height:18px;font-size:9.5px}
.gsub b{font-size:11.5px}.gsub small{font-size:10px}
.guide-tip{margin-top:12px;border-top:1px dashed #e2eaf5;padding-top:10px;font-size:10.5px;color:var(--faint);line-height:1.65}
.summary{border:1px solid var(--line);border-radius:12px;background:#f8fbff;padding:12px 14px}
.srow{display:flex;gap:12px;padding:5px 0;font-size:12.5px;align-items:flex-start}
.srow+.srow{border-top:1px dashed #e2eaf5}
.srow .sk{width:64px;flex:none;color:var(--faint);font-size:11.5px;padding-top:1px}
.srow .sv{min-width:0;color:#26344c}
.flowline{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.flowline .fstep{font-size:11px;color:#3c4c64;background:#fff;border:1px solid var(--line);border-radius:7px;padding:1px 6px}
.flowline .arr{color:#b3bfd0;font-size:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;background:#12264a;color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;box-shadow:0 10px 30px #0004;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(max-width:1180px){.tlay{grid-template-columns:1fr}.guide{position:static;order:-1}}
</style>
</head>

<div class="app" id="app">

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SAMPLES={
  topic:['三国野史里最被低估的五场战役','如果诸葛亮多活十年，三国格局会怎样','曹操的用人之道，放在今天还成立吗','三国时期的普通人，一天是怎么过的','刘备借荆州，真的是赖着不还吗'],
  hot:['年轻人为什么开始重新关注社区生活','社区食堂如何留住居民','老旧小区加装电梯，居民最关心哪些问题','城市绿道建成后，周边生活有哪些变化','越来越多家庭重新使用公共空间']
};
const HOT_LIST=[
 {rank:1,title:'年轻人为什么开始重新关注社区生活'},
 {rank:2,title:'社区食堂如何留住居民'},
 {rank:3,title:'老旧小区加装电梯，居民最关心哪些问题'},
 {rank:4,title:'城市绿道建成后，周边生活有哪些变化'},
 {rank:5,title:'越来越多家庭重新使用公共空间'},
 {rank:6,title:'县域公共服务如何走进日常生活'},
 {rank:7,title:'周末短途游为什么越来越受欢迎'},
 {rank:8,title:'社区图书馆如何留住读者'}
];
function parseRanks(){return [...new Set(String(S.ranks).split(/[,，\s]+/).map(x=>parseInt(x,10)).filter(n=>Number.isFinite(n)&&n>0))].slice(0,20)}
function genCandidates(){
  if(S.source==='direct'){S.candidates=[];S.selected=[];return}
  let list=[];
  if(S.source==='topic'){
    list=SAMPLES.topic.slice(0,FIXED.count).map((t,i)=>({id:'t'+i,text:t,meta:'主题生成'}));
  }else{
    const dir=S.hotDir.trim();
    if(dir){
      list=HOT_LIST.slice(0,FIXED.count).map(x=>({id:'hm'+x.rank,text:x.title,meta:'今日榜单 · 匹配'}));
    }else{
      const ranks=parseRanks();
      if(ranks.length){
        list=ranks.map(n=>{const it=HOT_LIST[(n-1)%HOT_LIST.length];return {id:'r'+n,text:it.title,meta:'第 '+n+' 名'}});
      }else{
        list=HOT_LIST.map(x=>({id:'a'+x.rank,text:x.title,meta:'第 '+x.rank+' 名'}));
      }
    }
  }
  S.candidates=list;S.selected=list.map(c=>c.id);S.err='';
  S.rankHidden=S.source==='hot';S.rankEdited=false;
  render();
}
function resetStep(){
  S.topic='';S.hotDir='';S.ranks='';S.title='';S.candidates=[];S.selected=[];
  S.rankHidden=false;S.rankEdited=false;S.deepOn=false;S.err='';render();
}
function hideCandWrap(){const el=document.getElementById('candWrap');if(el)el.style.display='none'}
function toggleAll(on){S.selected=on?S.candidates.map(c=>c.id):[];render()}
function toggleCand(id,on){if(on){if(!S.selected.includes(id))S.selected.push(id)}else S.selected=S.selected.filter(x=>x!==id);render()}
function selTitles(){
  if(S.source==='direct')return S.title.trim()?[S.title.trim()]:[];
  return S.candidates.filter(c=>S.selected.includes(c.id)).map(c=>c.text);
}
const S={source:'topic',topic:'三国野史',hotDir:'',ranks:'',title:'',candidates:[],selected:[],rankHidden:false,rankEdited:false,deepOn:false,step:0,max:0,cycle:'daily',when:'07:30',weekday:'周一',formats:['word'],err:''};
const FIXED={count:5,deai:true,ideaCount:3,style:'清晰克制',imgMode:'豆包',cover:1,body:5,toLib:true};
const STEPS=[
  {k:'title',n:'01',t:'标题设定',d:'选来源并勾选要生成的文章。'},
  {k:'orig',n:'02',t:'原稿设定',d:'设定原稿参数，后台触发。'},
  {k:'deep',n:'03',t:'深度加工（可选）',d:'核心立意、写作风格、三稿与合稿。'},
  {k:'image',n:'04',t:'图文生成',d:'为稿件生成封面与正文配图。'},
  {k:'export',n:'05',t:'导出',d:'选择导出格式，默认 Word。'},
  {k:'schedule',n:'06',t:'执行周期',d:'设定单次或周期性执行。'}
];
const SUBS=[
  {k:'3.1',t:'核心立意',d:'固定 '+FIXED.ideaCount+' 条'},
  {k:'3.2',t:'写作风格',d:'固定「'+FIXED.style+'」'},
  {k:'3.3',t:'生成三稿',d:'固定生成'},
  {k:'3.4',t:'三稿合稿',d:'固定生成合并稿'}
];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2000)}
function setSource(k){S.source=k;S.candidates=[];S.selected=[];S.rankHidden=false;S.rankEdited=false;S.err='';render()}
function picked(){const a=selTitles();return a[0]||''}
function goStep(i){if(i<=S.max){S.step=i;S.err='';render();scrollTop()}}
function jump(i){S.step=i;S.max=Math.max(S.max,i);S.err='';render();scrollTop()}
function enableDeep(){S.deepOn=true;jump(2)}
function next(){
  if(S.step===0){
    if(S.source==='direct'){
      if(!S.title.trim()){S.err='请填写指定文章标题';render();return}
    }else{
      if(!S.candidates.length){S.err='请先获取候选标题';render();return}
      if(!S.selected.length){S.err='请至少勾选 1 条候选标题';render();return}
    }
  }
  if(S.step>=STEPS.length-1){save();return}
  S.step++;S.max=Math.max(S.max,S.step);S.err='';render();scrollTop();
}
function prev(){if(S.step>0){S.step--;S.err='';render();scrollTop()}}
function scrollTop(){const w=document.getElementById('ws');if(w)w.scrollTo({top:0,behavior:'smooth'})}
function save(){toast('已保存并启用：共 '+selTitles().length+' 篇（示例）')}
function guideHTML(){
  return STEPS.map((s,i)=>{
    const cur=i===S.step,done=i<S.step,lock=i>S.max;
    let sub='';
    if(s.k==='deep'&&S.deepOn){
      sub='<div class="gsub">'+SUBS.map(x=>`<div class="gstep ${i<S.step?'done':''} ${i>S.max?'lock':''}"><span class="gn">${x.k}</span><span class="gt"><b>${x.t}</b><small>${x.d}</small></span></div>`).join('')+'</div>';
    }
    return `<button type="button" class="gstep ${cur?'cur':''} ${done?'done':''} ${lock?'lock':''}" onclick="goStep(${i})"><span class="gn">${done?'✓':s.n}</span><span class="gt"><b>${s.t}</b><small>${s.d}</small></span></button>${sub}`;
  }).join('');
}
function lockedRow(title,desc,val,tag){
  return `<div class="locked"><span class="lk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span class="lt"><b>${title}</b><small>${desc}</small></span><span class="lv">${val}</span><span class="tag-fixed">固定</span></div>`;
}
function stepHead(k,t,sub){return ''}
function titleStep(){
  const isDirect=S.source==='direct',hot=S.source==='hot',gen=S.candidates.length>0;
  const nSel=S.selected.length,nAll=S.candidates.length;
  const countCtl=`<span style="display:inline-flex;align-items:center;gap:8px"><span class="lbl" style="margin:0">生成标题数</span><input class="num" style="width:84px" value="${FIXED.count}" disabled><span class="unit">个</span><span class="tag-fixed">固定</span></span>`;
  const fetchLabel=gen?'重新获取候选标题':'获取候选标题';
  return stepHead('title','标题设定','选来源并勾选要生成的文章；定时执行时按这里的设定在后台生成。')
  +`<div class="set-card">
      <div class="field"><label class="lbl">来源</label>
        <div class="src-row"><div class="seg" role="radiogroup">${[['topic','主题生成'],['hot','热榜生成'],['direct','自定标题']].map(([k,l])=>`<button type="button" class="${S.source===k?'on':''}" onclick="setSource('${k}')">${l}</button>`).join('')}</div><button class="btn ghost" type="button" onclick="resetStep()">重置</button></div>
      </div>
      ${isDirect
        ? `<div class="field ${S.err?'err':''}"><label class="lbl">指定文章标题</label><input class="input" id="fTitle" value="${esc(S.title)}" placeholder="例如：社区食堂如何留住居民" oninput="S.title=this.value"><div class="hint" style="margin-top:6px">设定好后直接进入第 2 步「原稿设定」。</div><div class="err-msg" ${S.err?'':'hidden'}>${esc(S.err)}</div></div>`
        : hot
          ? `<div class="field ${S.err?'err':''}">
              <div class="field-head"><label class="lbl">热榜主题方向（可空）</label>${countCtl}</div>
              <div class="input-row"><input class="input" id="fTopic" value="${esc(S.hotDir)}" placeholder="例如：三国野史，那么将根据三国野史方向搜寻榜单类似主题方向标题；不填写那么获取所有" oninput="S.hotDir=this.value"><button class="btn primary" type="button" onclick="genCandidates()">${fetchLabel}</button></div>
            </div>
            ${S.rankHidden?'':`<div class="field" style="margin-bottom:0">
              <label class="lbl">榜单排名号</label>
              <input class="input" id="fRanks" value="${esc(S.ranks)}" placeholder="例如：1,5,14；那么按榜单第 1、5、14 名取原标题；填几个排名就生成几条候选。" oninput="S.ranks=this.value;S.rankEdited=true;hideCandWrap()">
              <div class="hint" style="margin-top:6px">按“主题方向”匹配榜单原标题（今日数据），找到关联的榜单原标题根据指定排名生成；也可以不指定主题方向，那么获取所有榜单标题数据，然后根据指定“榜单排名号”生成。你也可以指定“主题方向”匹配榜单标题（今日数据），选定匹配榜单标题生成（“榜单排名号”就无效了）。</div>
              <div class="err-msg" ${S.err?'':'hidden'}>${esc(S.err)}</div>
            </div>`}`
          : `<div class="field ${S.err?'err':''}">
              <div class="field-head"><label class="lbl">想写的主题</label>${countCtl}</div>
              <div class="input-row"><input class="input" id="fTopic" value="${esc(S.topic)}" placeholder="例如：三国野史" oninput="S.topic=this.value"><button class="btn primary" type="button" onclick="genCandidates()">${fetchLabel}</button></div>
              <div class="err-msg" ${S.err?'':'hidden'}>${esc(S.err)}</div>
            </div>`}
    </div>
    ${isDirect?'':`<div id="candWrap" style="${S.rankEdited?'display:none':''}"><div class="log-line">${gen?`已获取 ${nAll} 条候选标题`:'点击「获取候选标题」后在这里勾选'}</div>
    <div class="result"><div class="result-h"><b>候选标题</b><span class="selbar">${gen?`已选 ${nSel} / ${nAll} 篇 <button type="button" class="linkbtn" onclick="toggleAll(${nSel!==nAll})">${nSel===nAll?'取消全选':'全选'}</button>`:'待获取'}</span></div>
      <div class="result-b">${gen
        ? `<div class="cands" style="width:100%;text-align:left">${S.candidates.map((c,i)=>`<label class="cand ${S.selected.includes(c.id)?'on':''}"><input type="checkbox" class="chk" ${S.selected.includes(c.id)?'checked':''} onchange="toggleCand('${c.id}',this.checked)"><span class="idx">${i+1}</span><span>${esc(c.text)}</span><span class="pick">${esc(c.meta)}</span></label>`).join('')}</div>`
        : `<div><span class="sym">◇</span><b>候选标题将在这里展示</b>写好${hot?'热榜主题方向或榜单排名号':'主题'}后，点「获取候选标题」。</div>`}</div>
    </div></div>`}`;
}
function origStep(){
  const titles=selTitles(),n=titles.length;
  return stepHead('orig','原稿设定','设定原稿生成参数；定时执行时由后台触发，不需要现在生成。')
  +`<div class="set-card">
      <div class="field"><label class="lbl">本次将生成</label><div class="gencount"><b>${n}</b> 篇原稿</div></div>
      <div class="field"><label class="lbl">文章标题</label><div class="titlelist">${titles.map(t=>`<span class="tchip">${esc(t)}</span>`).join('')}</div></div>
      ${lockedRow('去 AI 化','降低 AI 味，保留事实与信息密度',FIXED.deai?'开':'关')}
    </div>
    <div class="log-line">定时执行时按上面的设定在后台生成</div>`;
}
function deepStep(){
  return stepHead('deep','深度加工（可选）','参数已由任务模板固定；定时执行会自动完成。')
  +`<div class="set-card">
      ${lockedRow('核心立意','提取核心主张、切入角度',FIXED.ideaCount+' 条')}
      ${lockedRow('写作风格','按风格生成原稿与三稿',FIXED.style)}
      ${lockedRow('生成三稿','按标题、立意和风格生成三稿','生成')}
      ${lockedRow('三稿合稿','三稿合并成一篇合并稿','生成')}
    </div>
    <div class="log-line">深度加工已包含在任务中（固定）</div>
    <div class="result"><div class="result-h"><b>三稿 / 合稿</b><span>待生成</span></div>
      <div class="result-b"><div><span class="sym">◇</span><b>三稿与合并稿将在执行时生成</b>这一步的参数已锁定，不需要每次设置。</div></div>
    </div>`;
}
function imageStep(){
  return stepHead('image','图文生成','为稿件生成封面与正文配图，参数已固定。')
  +`<div class="set-card">
      ${lockedRow('生图方式','豆包 / API',FIXED.imgMode)}
      ${lockedRow('封面 + 配图','封面 1 张 + 正文配图 5 张',FIXED.cover+' + '+FIXED.body)}
    </div>
    <div class="log-line">图文生成已包含在任务中（固定）</div>
    <div class="result"><div class="result-h"><b>图文稿</b><span>待生成</span></div>
      <div class="result-b"><div><span class="sym">◇</span><b>图文稿预览将在这里展示</b>封面 1 张 + 正文配图 5 张，执行时自动生成。</div></div>
    </div>`;
}
function fmtNames(){const m={word:'Word（.docx）',md:'Markdown（.md）'};return S.formats.map(x=>m[x]).join('、')||'未选择'}
function toggleFmt(k,on){
  if(on){if(!S.formats.includes(k))S.formats.push(k)}
  else{S.formats=S.formats.filter(x=>x!==k);if(!S.formats.length){toast('至少保留一种导出格式');S.formats=[k]}}
  render();
}
function exportStep(){
  const sel=fmtNames(),n=selTitles().length;
  return stepHead('export','导出','选择导出格式，可多选；默认 Word，执行完成后自动导出。')
  +`<div class="set-card">
      <div class="field"><label class="lbl">导出格式（可多选）</label>
        <div class="fmt-list">
          <label class="fmt ${S.formats.includes('word')?'on':''}"><input type="checkbox" ${S.formats.includes('word')?'checked':''} onchange="toggleFmt('word',this.checked)"><span class="ft"><b>Word（.docx）</b><small>适合继续编辑、投稿</small></span><span class="tag-fixed">默认</span></label>
          <label class="fmt ${S.formats.includes('md')?'on':''}"><input type="checkbox" ${S.formats.includes('md')?'checked':''} onchange="toggleFmt('md',this.checked)"><span class="ft"><b>Markdown（.md）</b><small>适合公众号、站点发布</small></span></label>
        </div>
      </div>
    </div>
    <div class="result"><div class="result-h"><b>本次产出</b><span>${n} 篇</span></div>
      <div class="result-b"><div><b style="font-size:15px;color:#14213a;display:block;margin-bottom:6px">合并稿图文稿 · ${n} 篇</b>执行完成后按所选格式（${sel}）导出，同时写入内容库；可在内容库再次导出。</div></div>
    </div>`;
}
function scheduleStep(){
  const cyc=S.cycle;
  const flow=['标题设定','原稿设定','深度加工（三稿/合稿）','图文生成','导出（'+S.formats.map(x=>x==='word'?'Word':'Markdown').join('/')+'）'];
  return stepHead('schedule','执行周期','最后一步：设定什么时候执行；保存后任务进入等待队列。')
  +`<div class="set-card">
      <div class="field"><label class="lbl">周期</label>
        <div class="seg" role="radiogroup">${[['once','单次'],['daily','每天'],['weekly','每周'],['custom','自定义']].map(([k,l])=>`<button type="button" class="${cyc===k?'on':''}" onclick="S.cycle='${k}';render()">${l}</button>`).join('')}</div>
      </div>
      <div class="field"><label class="lbl">${cyc==='once'?'执行时间':'执行时刻'}</label>
        ${cyc==='weekly'
          ? `<div class="field-head" style="justify-content:flex-start;gap:8px"><div class="seg" role="radiogroup">${[['周一','周一'],['周三','周三'],['周五','周五'],['周日','周日']].map(([k,l])=>`<button type="button" class="${S.weekday===k?'on':''}" onclick="S.weekday='${k}';render()">${l}</button>`).join('')}</div><input class="input" style="max-width:150px" value="${esc(S.when)}" placeholder="07:30" oninput="S.when=this.value"></div>`
          : `<input class="input" style="max-width:150px" value="${esc(S.when)}" placeholder="${cyc==='once'?'例如：2026-11-16 09:00':cyc==='custom'?'例如：每月 1 日 09:00':'07:30'}" oninput="S.when=this.value">`}
      </div>
    </div>
    <div class="log-line">保存后进入等待队列</div>
    <div class="summary" style="margin-top:10px">
      <div class="srow"><span class="sk">任务</span><span class="sv">共 ${selTitles().length} 篇 · ${S.source==='topic'?'主题生成':S.source==='hot'?'热榜生成':'自定标题'}</span></div>
      <div class="srow"><span class="sk">流程</span><span class="sv"><span class="flowline">${flow.map((x,i)=>`${i?'<span class="arr">›</span>':''}<span class="fstep">${esc(x)}</span>`).join('')}</span></span></div>
      <div class="srow"><span class="sk">固定参数</span><span class="sv">标题数 ${FIXED.count} 个 · 去AI化 ${FIXED.deai?'开':'关'} · 立意 ${FIXED.ideaCount} 条 · ${FIXED.style} · 封面 ${FIXED.cover} + 配图 ${FIXED.body}</span></div>
      <div class="srow"><span class="sk">导出</span><span class="sv">${fmtNames()}${FIXED.toLib?' · 同时写入内容库':''}</span></div>
      <div class="srow"><span class="sk">周期</span><span class="sv">${({once:'单次',daily:'每天',weekly:'每周 '+esc(S.weekday),custom:'自定义'})[cyc]} · ${esc(S.when)}</span></div>
    </div>`;
}
function actionsFor(k){
  const back=S.step>0?`<button class="btn ghost" type="button" onclick="prev()">上一步</button>`:'';
  if(k==='title')return `<div class="step-actions">${back}<button class="btn primary" type="button" onclick="next()">进入原稿设定</button></div>`;
  if(k==='orig')return `<div class="step-actions">${back}<button class="btn" type="button" onclick="jump(4)">导出本稿</button><button class="btn" type="button" onclick="jump(3)">进入图文生成</button><button class="btn primary" type="button" onclick="enableDeep()">原稿深度加工</button></div>`;
  if(k==='deep')return `<div class="step-actions">${back}<button class="btn" type="button" onclick="jump(4)">导出三稿</button><button class="btn primary" type="button" onclick="jump(3)">进入图文生成</button></div>`;
  if(k==='image')return `<div class="step-actions">${back}<button class="btn primary" type="button" onclick="jump(4)">下一步：导出</button></div>`;
  if(k==='export')return `<div class="step-actions">${back}<button class="btn primary" type="button" onclick="jump(5)">下一步：执行周期</button></div>`;
  return `<div class="step-actions">${back}<button class="btn primary" type="button" onclick="save()">保存并启用</button></div>`;
}
function render(){
  $('#gsteps').innerHTML=guideHTML();
  const fns={title:titleStep,orig:origStep,deep:deepStep,image:imageStep,export:exportStep,schedule:scheduleStep};
  const k=STEPS[S.step].k;
  $('#stepArea').innerHTML=fns[k]()+actionsFor(k);
  const f=$('#fTopic')||$('#fTitle'); if(f&&S.err)f.focus();
}
render();
</script>
</body>
</html>
