<head>

<title>AIGenPlatform · 新建任务 · 方案C 流程模板 · 261115 v0.1.0</title>
<style>
:root{--bg:#f1f6fc;--paper:#fff;--ink:#14213a;--muted:#596579;--faint:#8592a6;--line:#d9e3f0;--line2:#e8eef7;--accent:#1c5fc4;--accent-d:#164ea3;--soft:#e3edfc;--soft2:#f5f9fe;--navy:#0f2348;--green:#17734a;--green-bg:#e3f4ea;--amber:#8a6a16;--amber-bg:#f4f0e6;--red:#c42b2b;--red-bg:#fde8e8;--radius:14px;--shadow:0 6px 24px #12305c0f;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--ctl-h:36px;--ctl-radius:12px;--ctl-border:#6b7c94;--ring:0 0 0 3px rgba(28,95,196,.30)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.55 var(--sans)}

.stp.done b{color:var(--green)}
.stp.lock{opacity:.55;cursor:default}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px 16px;min-height:420px;display:flex;flex-direction:column}

.field-head .lab{margin:0}
.input{width:100%;height:var(--ctl-h);border:2px solid var(--ctl-border);border-radius:12px;padding:0 12px;background:#fff;min-width:0;font-size:13px}
.input:focus{outline:0;border-color:var(--accent);box-shadow:var(--ring)}
.input::placeholder{color:#99a5b6}
.field.err .input{border-color:var(--red)}
.err-msg{margin:6px 0 0;font-size:12px;color:var(--red)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:#e6eef8;border-radius:10px;border:0}

.seg button:hover:not(.on){background:rgba(255,255,255,.55);color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 1px 3px rgba(20,33,58,.18)}

.cntctl{display:inline-flex;align-items:center;gap:8px}

.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num{-moz-appearance:textfield;appearance:textfield}
.unit{font-size:12px;color:#596579}
.cands{display:flex;flex-direction:column;gap:7px}
.cand{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;text-align:left;font-size:13px;color:#26344c;transition:border-color .15s,background .15s}
.cand:hover{border-color:#b9cce6;background:#f8fbff}

.cand.on .idx{background:var(--accent);color:#fff}
.cand .pick{margin-left:auto;font-size:11.5px;color:var(--accent);white-space:nowrap}

.picked .pt{min-width:0;flex:1}.picked small{display:block;font-size:11.5px;color:var(--faint);margin-bottom:2px}.picked b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.switch-row .sl{min-width:0}.switch-row b{display:block;font-size:13px;font-weight:600}.switch-row small{display:block;font-size:11.5px;color:var(--faint)}
.switch{--w:40px;width:var(--w);height:22px;border-radius:11px;border:0;background:#c5ced8;position:relative;flex:none}
.switch[aria-checked="true"]{background:var(--accent)}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]:after{left:21px}
.hint{margin:10px 0 0;font-size:12px;color:var(--faint);line-height:1.6}
.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choice{position:relative;display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;text-align:left;transition:border-color .15s,background .15s,box-shadow .15s;min-height:112px}
.choice:hover{border-color:#b9cce6}
.choice.on{border-color:var(--accent);background:#f5f9ff;box-shadow:0 0 0 3px rgba(28,95,196,.08)}
.choice .ct{display:flex;align-items:center;gap:8px}.choice .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid #b7c2d1;flex:none;display:grid;place-items:center}
.choice.on .rd{border-color:var(--accent)}.choice.on .rd:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.choice b{font-size:13.5px;font-weight:650}
.choice small{font-size:11.5px;color:var(--faint);line-height:1.5}
.choice .tagline{margin-top:auto;font-size:11px;color:var(--accent);font-weight:600}
.choice .sub{margin-top:8px;padding-top:8px;border-top:1px dashed #e2eaf5}
.choice .sub .lab{font-size:11.5px;margin-bottom:6px}
.choice-static{cursor:default}
.choice .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#26344c}
.check input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid #b7c2d1;border-radius:5px;background:#fff;display:grid;place-items:center;margin:0}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked:after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.outline-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8fbff;margin-bottom:14px}

.outline-box b{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#3c4c64;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;line-height:19px}
.chip.blue{background:var(--soft);border-color:#c9dcf7;color:var(--accent)}
.chip.green{background:var(--green-bg);border-color:transparent;color:var(--green)}
.summary{border:1px solid var(--line);border-radius:13px;background:#f8fbff;padding:13px 15px}
.srow{display:flex;gap:12px;padding:5px 0;font-size:12.5px;align-items:flex-start}
.srow+.srow{border-top:1px dashed #e2eaf5}

.srow .sv{min-width:0;color:#26344c}
.flowline{display:flex;flex-wrap:wrap;gap:4px;align-items:center}

.flowline .arr{color:#b3bfd0;font-size:11px}
.actionbar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;padding:13px 2px 14px;margin-top:14px;background:linear-gradient(180deg,#f1f6fc00,#f1f6fc 30%,#f1f6fc)}
.actionbar .grow{flex:1}
.actionbar .note{font-size:11.5px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;background:#12264a;color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;box-shadow:0 10px 30px #0004;opacity:0;pointer-events:none;transition:opacity .2s}

.tpl-h{margin:2px 0 12px}

.tpl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.tplcard{display:flex;flex-direction:column;gap:7px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 15px;transition:border-color .15s,box-shadow .15s,background .15s;min-height:150px}
.tplcard:hover{border-color:var(--accent);background:#f8fbff;box-shadow:0 0 0 3px rgba(28,95,196,.07)}
.tpl-n{font-size:14px;font-weight:700}
.tpl-d{font-size:11.5px;color:var(--faint);line-height:1.5}

.tpl-bar .tv{min-width:0;flex:1}.tpl-bar b{font-size:13px;display:block}.tpl-bar small{display:block;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsteps{display:flex;flex-direction:column;gap:10px}
.wstep{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s,box-shadow .15s;scroll-margin-top:66px}
.wstep.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(28,95,196,.08),var(--shadow)}
.wstep.lock{opacity:.6}
.whead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 16px;text-align:left}
.wn{width:26px;height:26px;border-radius:50%;background:#eef3fa;color:#7b8aa0;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.wstep.cur .wn{background:var(--accent);color:#fff}
.wstep.done .wn{background:var(--green-bg);color:var(--green)}
.wt{min-width:0;flex:1}.wt b{display:block;font-size:13.5px;font-weight:650}.wt small{display:block;font-size:11.5px;color:var(--faint);margin-top:1px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wst{font-size:10.5px;border-radius:999px;padding:1px 8px;line-height:18px;color:#8592a6;background:#f2f5f9;white-space:nowrap;flex:none}
.wst.cur{color:var(--accent);background:var(--soft);font-weight:600}
.wst.done{color:var(--green);background:var(--green-bg);font-weight:600}
.wbody{padding:0 18px 15px 54px}
.wbody .step-h{display:none}
.wfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed #e2eaf5}

@media(max-width:1100px){.stepper{flex-wrap:wrap}.stp{flex:1 1 150px}.choice-grid{grid-template-columns:1fr}}
</style>

<body>
<div class="app" id="app">
<aside class="side" aria-label="主导航">

  <button class="nv" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v16H4zM14 4h6v16h-6z"/></svg>内容库</button>
  <button class="nv active" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="8" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="10" cy="19" r="1.4" fill="currentColor" stroke="none"/></svg>任务中心<span class="cnt">1</span></button>

  <button class="nv" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>系统</button>

</aside>
<main id="ws">
  <div class="subnav"><div class="subnav-top">
    <div class="crumb">任务中心 / <b>新建任务</b></div>
    <div class="right"><span class="local-chip">本机运行 · 127.0.0.1</span><span class="wk-chip">Worker 在线</span><button class="wait-btn" type="button">待处理 3</button><span class="demo-chip">示例数据 · 选稿</span><button class="ubtn" type="button"><span class="ava">示</span>示例用户 ▾</button></div>
  </div></div>
  <div class="page">
    <div class="page-h">
      <div><div class="eyebrow">定时任务</div><h1>新建任务</h1><p>先选一条执行流程，再逐步配置，最后一步设定执行周期。</p></div>
      <button class="btn" type="button" onclick="toast('已取消（示例）')">取消</button>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SAMPLES={
  topic:['三国野史里最被低估的五场战役','如果诸葛亮多活十年，三国格局会怎样','曹操的用人之道，放在今天还成立吗','三国时期的普通人，一天是怎么过的','刘备借荆州，真的是赖着不还吗'],
  hot:['年轻人为什么开始重新发现社区生活','社区食堂如何留住居民','老旧小区加装电梯，居民最关心哪些问题','城市绿道建成后，周边生活有哪些变化','越来越多家庭重新使用公共空间']
};
const S={tpl:null,source:'topic',topic:'三国野史',hotDir:'',title:'',count:5,picked:0,deai:true,mode:'drafts',imgMode:'doubao',ideaCount:3,style:'清晰克制',draftAction:'merge',exportScope:'all',mergeIllustrated:true,fmt:'docx',toLib:true,cycle:'daily',when:'07:30',weekday:'周一',step:0,max:0,err:''};
const TPL={
 t1:{name:'原稿直出',desc:'只要原稿，完成后导出文稿',chain:['选择标题','生成原稿','导出文稿'],mode:'original'},
 t2:{name:'图文稿',desc:'原稿加做封面与配图',chain:['选择标题','生成原稿','生成图文稿','导出图文稿'],mode:'illustrated',produce:true,produceTitle:'图文稿设置',produceDesc:'生图方式与配图'},
 t3:{name:'三稿直出',desc:'三稿生成后单稿或全稿导出',chain:['选择标题','生成原稿','三稿生成','三稿单稿/全稿导出'],mode:'drafts',action:'export',produce:true,produceTitle:'三稿设置',produceDesc:'立意、风格与导出范围'},
 t4:{name:'三稿图文稿',desc:'三稿逐稿生成图文稿',chain:['选择标题','生成原稿','三稿生成','三稿单稿图文稿生成','导出三稿单稿图文稿'],mode:'drafts',action:'illustrated',produce:true,produceTitle:'三稿与单稿图文稿',produceDesc:'立意、风格与生图方式'},
 t5:{name:'合并稿',desc:'三稿合并成一篇合并稿',chain:['选择标题','生成原稿','三稿生成','合并成合并稿','导出合并稿'],mode:'drafts',action:'merge',mergeIllustrated:false,produce:true,produceTitle:'三稿与合并稿',produceDesc:'立意、风格与合并'},
 t6:{name:'合并稿图文稿',desc:'合并稿再生成图文稿后导出',chain:['选择标题','生成原稿','三稿生成','合并成合并稿','合并稿生成图文稿','导出合并稿图文稿'],mode:'drafts',action:'merge',mergeIllustrated:true,produce:true,produceTitle:'三稿、合并与图文稿',produceDesc:'立意、风格与合并稿图文稿'}
};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2000)}
function cands(){return S.source==='direct'?[]:SAMPLES[S.source]}
function picked(){if(S.source==='direct')return S.title;const a=cands();return a[Math.min(S.picked,a.length-1)]||''}
function topicLabel(){return S.source==='hot'?'热榜主题方向':'想写的主题'}
function steps(){
  if(!S.tpl)return [];
  const t=TPL[S.tpl];
  const a=[{k:'title',t:'选择标题',d:'来源与示例标题'},{k:'orig',t:'生成原稿',d:'去 AI 化'}];
  if(t.produce)a.push({k:'produce',t:t.produceTitle,d:t.produceDesc});
  a.push({k:'export',t:'导出',d:'格式与产出'},{k:'schedule',t:'执行周期',d:'定时执行'});
  return a;
}
function chain(){return S.tpl?TPL[S.tpl].chain.slice():[]}
function outputLabel(){
  const t=S.tpl?TPL[S.tpl]:null;
  if(!t)return '—';
  if(t.mode==='original')return '原稿 · 1 篇';
  if(t.mode==='illustrated')return '图文稿 · 1 篇（封面 1 + 配图 5）';
  if(t.action==='export')return S.exportScope==='all'?'三稿全稿 · 3 篇':'三稿单稿 · 1 篇';
  if(t.action==='illustrated')return '三稿单稿图文稿 · 3 篇';
  return t.mergeIllustrated?'合并稿图文稿 · 1 篇':'合并稿 · 1 篇';
}
function selectTpl(k){
  const t=TPL[k];
  S.tpl=k;S.mode=t.mode;S.draftAction=t.action||'export';S.mergeIllustrated=!!t.mergeIllustrated;
  S.exportScope='all';S.step=0;S.max=0;S.err='';render();
}
function resetTpl(){S.tpl=null;S.step=0;S.max=0;S.err='';render()}
function segHTML(name,opts,cur,fn,sm){
  return `<div class="seg${sm?' sm':''}" role="radiogroup">${opts.map(([k,l])=>`<button type="button" class="${cur===k?'on':''}" data-${name}="${k}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
}
function setSource(k){S.source=k;S.picked=0;S.err='';render()}
function setFmt(k){S.fmt=k;render()}
function setCycle(k){S.cycle=k;render()}
function setOn(name,val){S[name]=val;render()}
function setImg(k){S.imgMode=k;render()}
function setScope(k){S.exportScope=k;render()}
function setWeekday(k){S.weekday=k;render()}
function setNum(v){S.count=Math.max(1,Math.min(10,+v||1));render()}
function setIdea(v){S.ideaCount=Math.max(1,Math.min(10,+v||1));render()}
function pick(i){S.picked=i;render()}
function goStep(i){if(i<=S.max){S.step=i;S.err='';render()}}
function next(){
  const defs=steps(),k=defs[S.step].k;
  if(k==='title'){
    if(S.source==='direct'&&!S.title.trim()){S.err='请填写指定文章标题';render();return}
    if(S.source==='topic'&&!S.topic.trim()){S.err='请填写想写的主题';render();return}
  }
  if(S.step>=defs.length-1){save();return}
  S.step++;S.max=Math.max(S.max,S.step);S.err='';render();
}
function prev(){if(S.step>0){S.step--;S.err='';render()}}
function save(){toast('已保存并启用：「'+picked()+'」（示例）')}
function produceStep(defs){
  const t=TPL[S.tpl];
  if(t.mode==='illustrated'){
    return stepTitleHTML(defs,t.produceTitle,t.produceDesc+'。')
      +`<div class="field"><label class="lab">生图方式</label>${segHTML('img',[['doubao','豆包'],['api','API']],S.imgMode,'setImg')}</div>
        <p class="hint">原稿生成后，为这篇稿生成封面 1 张 + 配图 5 张，再导出图文稿。</p>`;
  }
  let body=`<div class="field-head" style="margin-bottom:12px">
      <div class="field" style="margin:0;flex:1"><label class="lab">立意数</label><div class="cntctl"><input class="num" type="number" min="1" max="10" value="${S.ideaCount}" onchange="setIdea(this.value)"><span class="unit">条</span></div></div>
      <div class="field" style="margin:0;flex:2"><label class="lab">写作风格</label><input class="input" value="${esc(S.style)}" oninput="S.style=this.value" placeholder="例如：清晰克制"></div>
    </div>`;
  if(t.action==='export'){
    body+=`<div class="field"><label class="lab">导出范围</label>${segHTML('scope',[['single','单稿（选定 1 稿）'],['all','全稿（3 稿）']],S.exportScope,'setScope')}</div>`;
  }
  if(t.action==='illustrated'){
    body+=`<div class="field"><label class="lab">生图方式</label>${segHTML('img',[['doubao','豆包'],['api','API']],S.imgMode,'setImg')}</div>
      <p class="hint">三稿逐稿生成封面 1 张 + 配图 5 张，分别导出三稿单稿图文稿。</p>`;
  }
  if(t.action==='merge'){
    body+=`<div class="switch-row"><div class="sl"><b>三稿合并成一篇合并稿</b><small>${t.mergeIllustrated?'合并稿再生成封面与配图，导出合并稿图文稿':'只生成合并稿，不再生成图文稿'}</small></div><span class="chip ${t.mergeIllustrated?'blue':''}">${t.mergeIllustrated?'合并稿 → 图文稿':'仅合并稿'}</span></div>`;
    if(t.mergeIllustrated)body+=`<div class="field" style="margin-top:12px"><label class="lab">生图方式</label>${segHTML('img',[['doubao','豆包'],['api','API']],S.imgMode,'setImg')}</div>`;
  }
  body+=`<p class="hint">当前产出：${outputLabel()}。</p>`;
  return stepTitleHTML(defs,t.produceTitle,t.produceDesc+'。')+body;
}
function summaryOf(k){
  const t=TPL[S.tpl];
  if(k==='title')return `${S.source==='topic'?'主题生成':S.source==='hot'?'热榜生成':'自定标题'} · ${picked()||'—'}`;
  if(k==='orig')return `去 AI 化 · ${S.deai?'开':'关'}`;
  if(k==='produce')return t.mode==='drafts'?`${outputLabel()} · 立意 ${S.ideaCount} 条 · ${S.style}`:outputLabel();
  if(k==='export')return `${S.fmt==='docx'?'Word（.docx）':'Markdown（.md）'}${S.toLib?' · 写入内容库':''}`;
  if(k==='schedule')return `${({once:'单次',daily:'每天',weekly:'每周 '+S.weekday,custom:'自定义'})[S.cycle]} · ${S.when}`;
  return '';
}
function renderTemplates(){
  $('#host').innerHTML=`<div class="tpl-h"><h2>选择执行流程</h2><p>六条流程对应图文生成的六种产出；选定后逐步配置，最后一步设定执行周期。</p></div>
    <div class="tpl-grid">${Object.entries(TPL).map(([k,t])=>`<button type="button" class="tplcard" onclick="selectTpl('${k}')"><span class="tpl-n">${t.name}</span><span class="tpl-d">${t.desc}</span><span class="tpl-chain">${t.chain.map((x,i)=>`${i?'<span>›</span>':''}<em>${x}</em>`).join('')}</span><span class="tpl-go">用这条流程 →</span></button>`).join('')}</div>`;
}
function renderWizard(){
  const defs=steps(),t=TPL[S.tpl],last=S.step===defs.length-1;
  $('#host').innerHTML=`<div class="tpl-bar"><span class="tk">已选流程</span><div class="tv"><b>${t.name}</b><small>${t.chain.join(' › ')}</small></div><button class="btn ghost" type="button" onclick="resetTpl()">换流程</button></div>
    <div class="wsteps">${defs.map((d,i)=>`<section class="wstep ${i===S.step?'cur':''} ${i<S.step?'done':''} ${i>S.max?'lock':''}">
      <button type="button" class="whead" onclick="goStep(${i})"><span class="wn">${i<S.step?'✓':i+1}</span><span class="wt"><b>${d.t}</b><small>${i<S.step?summaryOf(d.k):d.d}</small></span><span class="wst ${i===S.step?'cur':i<S.step?'done':''}">${i===S.step?'进行中':i<S.step?'已完成':'待设置'}</span></button>
      ${i===S.step?`<div class="wbody">${renderStep(d.k)}<div class="wfoot"><button class="btn" type="button" ${i===0?'disabled':''} onclick="prev()">上一步</button><button class="btn primary" type="button" onclick="next()">${last?'保存并启用':'下一步'}</button></div></div>`:''}
    </section>`).join('')}</div>`;
  const f=$('#fTopic')||$('#fTitle');
  if(f&&S.err)f.focus();
  if(S.step>0)setTimeout(()=>{const el=document.querySelector('.wstep.cur');if(el)el.scrollIntoView({block:'start',behavior:'smooth'})},60);
}
function stepTitleHTML(defs,k,sub){
  return `<div class="step-h"><small>第 ${S.step+1} 步 · 共 ${defs.length} 步</small><h2>${k}</h2><p>${sub}</p></div>`;
}
function titleStep(defs){
  const isDirect=S.source==='direct';
  return stepTitleHTML(defs,'选择标题','先定标题来源；定时执行时会按来源重新生成标题，这里选一条作示例。')
  +`<div class="field"><label class="lab">来源</label>${segHTML('src',[['topic','主题生成'],['hot','热榜生成'],['direct','自定标题']],S.source,'setSource')}</div>`
  +(isDirect
    ? `<div class="field ${S.err?'err':''}"><label class="lab">指定文章标题</label><input class="input" id="fTitle" value="${esc(S.title)}" placeholder="例如：社区食堂如何留住居民" oninput="S.title=this.value"><div class="err-msg" ${S.err?'':'hidden'}>${esc(S.err)}</div></div>`
    : `<div class="field ${S.err?'err':''}">
        <div class="field-head"><label class="lab">${topicLabel()}${S.source==='hot'?'（可空，空则用榜单名）':''}</label>
          <div class="cntctl"><span class="lab">生成标题数</span><input class="num" type="number" min="1" max="10" value="${S.count}" onchange="setNum(this.value)"><span class="unit">个</span></div>
        </div>
        <input class="input" id="fTopic" value="${esc(S.source==='hot'?S.hotDir:S.topic)}" placeholder="${S.source==='hot'?'例如：三国野史，那么将根据三国野史方向搜寻榜单类似主题方向标题；不填写那么获取所有':'例如：三国野史'}" oninput="${S.source==='hot'?'S.hotDir':'S.topic'}=this.value">
        <div class="err-msg" ${S.err?'':'hidden'}>${esc(S.err)}</div>
      </div>
      <div class="field">
        <div class="field-head"><label class="lab">候选标题</label><span class="hint" style="margin:0">示例 · 点击选择</span></div>
        <div class="cands">${cands().map((t,i)=>`<button type="button" class="cand ${S.picked===i?'on':''}" onclick="pick(${i})"><span class="idx">${i+1}</span><span>${esc(t)}</span><span class="pick">${S.picked===i?'已选':'选它'}</span></button>`).join('')}</div>
      </div>`);
}
function origStep(defs){
  return stepTitleHTML(defs,'生成原稿','原稿生成后会写入内容库；定时执行时按下面的设置跑。')
  +`<div class="picked"><div class="pt"><small>本篇标题</small><b>${esc(picked()||'—')}</b></div><button class="btn ghost" type="button" onclick="goStep(0)">更换</button></div>
    <div class="switch-row"><div class="sl"><b>去 AI 化</b><small>降低 AI 味，保留事实与信息密度</small></div><button class="switch" role="switch" aria-checked="${S.deai}" aria-label="去 AI 化" onclick="S.deai=!S.deai;render()"></button></div>
    <p class="hint">原稿会按「${esc(picked()||'示例标题')}」生成，完成后自动写入内容库（示例）。</p>`;
}
function exportStep(defs){
  return stepTitleHTML(defs,'导出','选择导出格式和产出位置；定时执行完成后自动导出。')
  +`<div class="outline-box"><div class="ot">本次产出</div><b>${outputLabel()}</b></div>
    <div class="field"><label class="lab">导出格式</label>${segHTML('fmt',[['docx','Word（.docx）'],['md','Markdown（.md）']],S.fmt,'setFmt')}</div>
    <div class="switch-row"><div class="sl"><b>同时写入内容库</b><small>执行完成后在内容库可查看、再次导出</small></div><button class="switch" role="switch" aria-checked="${S.toLib}" aria-label="同时写入内容库" onclick="S.toLib=!S.toLib;render()"></button></div>
    <p class="hint">定时任务执行完成后自动按所选格式导出；导出文件同时保留在内容库。</p>`;
}
function scheduleStep(defs){
  const flow=chain();
  return stepTitleHTML(defs,'执行周期','最后设定什么时候执行；保存后任务进入等待队列。')
  +`<div class="field"><label class="lab">周期</label>${segHTML('cyc',[['once','单次'],['daily','每天'],['weekly','每周'],['custom','自定义']],S.cycle,'setCycle')}</div>
    <div class="field">
      <label class="lab">${S.cycle==='once'?'执行时间':'执行时刻'}</label>
      ${S.cycle==='once'
        ? `<input class="input" style="max-width:280px" value="${esc(S.when)}" placeholder="例如：2026-11-16 09:00" oninput="S.when=this.value">`
        : S.cycle==='weekly'
          ? `<div class="field-head" style="justify-content:flex-start;gap:8px">${segHTML('wd',[['周一','周一'],['周三','周三'],['周五','周五'],['周日','周日']],S.weekday,'setWeekday',true)}<input class="input" style="max-width:150px" value="${esc(S.when)}" placeholder="07:30" oninput="S.when=this.value"></div>`
          : S.cycle==='custom'
            ? `<input class="input" style="max-width:320px" value="${esc(S.when)}" placeholder="例如：每月 1 日 09:00" oninput="S.when=this.value">`
            : `<input class="input" style="max-width:150px" value="${esc(S.when)}" placeholder="07:30" oninput="S.when=this.value">`}
    </div>
    <div class="summary" style="margin-top:4px">
      <div class="srow"><span class="sk">任务</span><span class="sv">${esc(picked()||'—')} · ${S.source==='topic'?'主题生成':S.source==='hot'?'热榜生成':'自定标题'}</span></div>
      <div class="srow"><span class="sk">流程</span><span class="sv"><span class="flowline">${flow.map((x,i)=>`${i?'<span class="arr">›</span>':''}<span class="fstep">${esc(x)}</span>`).join('')}</span></span></div>
      <div class="srow"><span class="sk">产出</span><span class="sv">${outputLabel()}</span></div>
      <div class="srow"><span class="sk">导出</span><span class="sv">${S.fmt==='docx'?'Word（.docx）':'Markdown（.md）'}${S.toLib?' · 同时写入内容库':''}</span></div>
      <div class="srow"><span class="sk">周期</span><span class="sv">${({once:'单次',daily:'每天',weekly:'每周 '+esc(S.weekday),custom:'自定义'})[S.cycle]} · ${esc(S.when)}</span></div>
    </div>`;
}
function renderStep(k){
  const defs=steps();
  if(k==='title')return titleStep(defs);
  if(k==='orig')return origStep(defs);
  if(k==='produce')return produceStep(defs);
  if(k==='export')return exportStep(defs);
  return scheduleStep(defs);
}
function render(){
  if(!S.tpl){renderTemplates();return}
  const defs=steps();
  if(S.max>defs.length-1)S.max=defs.length-1;
  if(S.step>defs.length-1)S.step=defs.length-1;
  renderWizard();
}
render();
</script>
</body>
