  {id:'R-198',taskId:'G-01',name:'社区生活与公共服务',start:'11-12 07:30',status:'失败',cost:'1分02秒',output:null,log:'07:30 开始执行\n07:31 生成标题成功\n07:31 写稿阶段 LLM 请求超时，已重试 1 次仍失败。'},
  {id:'R-197',taskId:'G-02',name:'平台热榜',start:'11-12 08:00',status:'成功',cost:'3分05秒',output:{cid:'C-0101',title:'老旧小区加装电梯，居民最关心哪些问题'},log:'08:00 开始执行\n08:03 已写入内容库 C-0101'},
  {id:'R-196',taskId:'G-04',name:'县域公共服务如何走进日常生活',start:'11-12 10:00',status:'成功',cost:'4分12秒',output:{cid:'C-0100',title:'城市绿道建成后，周边生活有哪些变化'},log:'10:00 开始执行\n10:04 已写入内容库 C-0100'}
];
const STMAP={成功:'ok',运行中:'run',失败:'fail',等待:'wait',挂起:'hang'};
const F={pane:'monitor',status:'全部',from:'',to:'',q:'',fold:{},open:'G-01'};
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateKey(r){return String(r.start||'').slice(0,5)}
function normDate(v){
  v=String(v||'').trim();
  if(!v) return '';
  const m=v.match(/^(?:\d{4}[-/])?(\d{1,2})[-/](\d{1,2})$/);
  if(!m) return v.length>=5?v.slice(-5):v;
  return String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
}
function timeOf(r){return String(r.start||'').slice(6)}
function todayKey(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value;
  return g('month')+'-'+g('day');
}
function dateLabel(k){
  const t=todayKey();
  const d=new Date();
  const iso=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai'}).format(new Date());
  const base=new Date(iso+'T12:00:00+08:00');
  const y=new Date(base);y.setDate(y.getDate()-1);
  const tm=new Date(base);tm.setDate(tm.getDate()+1);
  const fmt=x=>String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  if(k===t) return k+' 今天';
  if(k===fmt(y)) return k+' 昨天';
  if(k===fmt(tm)) return k+' 明天';
  return k;
}
function filtered(){
  return RUNS.filter(r=>{
    if(F.status!=='全部' && r.status!==F.status) return false;
    const k=dateKey(r);
    const from=normDate(F.from), to=normDate(F.to);
    if(from && k<from) return false;
    if(to && k>to) return false;
    if(F.q){
      const q=F.q.toLowerCase();
      const blob=(r.name+' '+r.id+' '+(r.output&&r.output.title||'')+' '+(r.note||'')).toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  });
}
function todayRuns(){return RUNS.filter(r=>dateKey(r)===todayKey())}
function counts(list){
  const c={all:list.length,成功:0,失败:0,运行中:0,挂起:0,等待:0};
  list.forEach(r=>{if(c[r.status]!=null)c[r.status]++});
  return c;
}
function stBadge(s){return `<span class="st ${STMAP[s]||'wait'}"><i class="dot ${STMAP[s]||'wait'}"></i>${esc(s)}</span>`}
function ops(r){
  const a=[];
  if(r.status==='失败') a.push(`<button type="button" class="btn sm" onclick="retry('${r.id}')">重试</button>`);
  if(r.status==='挂起') a.push(`<button type="button" class="btn sm primary" onclick="resume('${r.id}')">继续</button>`);
  a.push(`<button type="button" class="btn sm ghost" onclick="showLog('${r.id}')">看日志</button>`);
  return `<div class="ops">${a.join('')}</div>`;
}
function outLink(r){
  if(r.output&&r.output.cid) return `<a class="link" href="javascript:void(0)" onclick="openOut('${r.output.cid}')">${esc(r.output.cid)} · ${esc(r.output.title)} ↗</a>`;
  return `<span class="faint">—</span>`;
}
function retry(id){toast('已重新排队 '+id+'（示例）')}
function resume(id){toast('已继续执行 '+id+'（示例）')}
function openOut(cid){toast('打开内容库 '+cid+'（示例）')}
function showLog(id){
  const r=RUNS.find(x=>x.id===id);if(!r)return;
  const host=document.getElementById('modHost');
  host.hidden=false;
  host.innerHTML=`<div class="modal-scrim" onclick="if(event.target===this)closeLog()"><div class="modal" role="dialog" aria-label="执行日志"><div class="modal-h"><b>${esc(r.name)} · ${esc(r.start)} · 日志</b><button type="button" class="btn sm" onclick="closeLog()">关闭</button></div><div class="modal-b">${esc(r.log||'暂无日志')}</div></div></div>`;
}
function closeLog(){const h=document.getElementById('modHost');h.hidden=true;h.innerHTML=''}
function setStatus(s){F.status=s;render()}
function setPane(p){F.pane=p;render()}
function onQ(v){F.q=v;render()}
function onFrom(v){F.from=v;render()}
function onTo(v){F.to=v;render()}
function toggleFold(k){F.fold[k]=!F.fold[k];render()}
function toggleCard(id){F.open=F.open===id?'':id;render()}
function filterBar(){
  const sts=['全部','等待','运行中','成功','失败','挂起'];
  return `<div class="bar filter">
    <span class="lbl">状态</span>
    <div class="seg" role="tablist" aria-label="按状态筛选">${sts.map(s=>`<button type="button" class="${F.status===s?'on':''}" onclick="setStatus('${s}')">${s}</button>`).join('')}</div>
    <span class="lbl" style="margin-left:8px">日期</span>
    <input class="input" type="text" inputmode="numeric" placeholder="11-12" value="${esc(F.from)}" onchange="onFrom(this.value)" onkeydown="if(event.key==='Enter'){onFrom(this.value)}" aria-label="起始日期 月-日" style="width:88px">
    <span class="faint">至</span>
    <input class="input" type="text" inputmode="numeric" placeholder="11-14" value="${esc(F.to)}" onchange="onTo(this.value)" onkeydown="if(event.key==='Enter'){onTo(this.value)}" aria-label="结束日期 月-日" style="width:88px">
    <input class="input" type="search" placeholder="搜索任务名 / 产出 / 编号" value="${esc(F.q)}" oninput="onQ(this.value)" aria-label="搜索" style="margin-left:auto;width:220px">
  </div>`;
}
function setupHTML(){
  const rows=TASKS.map(t=>`<tr>
    <td><b>${esc(t.name)}</b></td>
    <td class="faint"><span title="${esc(t.summary)}">${esc(t.summary)}</span></td>
    <td class="mono">${esc(t.cycle+' '+t.when)}</td>
    <td class="mono">${esc(t.next)}</td>
    <td><button type="button" class="switch" role="switch" aria-checked="${t.enabled?'true':'false'}" aria-label="启用 ${esc(t.name)}" onclick="toast('选稿页不改任务状态')"></button></td>
    <td><div class="ops"><button type="button" class="btn sm" onclick="toast('选稿页不进入编辑')">编辑</button><button type="button" class="btn sm" onclick="toast('已触发立即执行（示例）')">立即执行</button></div></td>
  </tr>`).join('');
  return `<div class="tbl-wrap"><table class="table"><thead><tr><th>任务名</th><th>参数摘要</th><th>执行周期</th><th>下次执行</th><th>启用</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function fitFill(){
  const host=document.getElementById('pageHost');
  let pad=document.getElementById('fillPad');
  if(!pad){pad=document.createElement('div');pad.id='fillPad';host.appendChild(pad)}
  pad.style.height='0px';
  const bottom=host.getBoundingClientRect().bottom;
  const target=window.innerHeight-20;
  const gap=Math.max(0,Math.round(target-bottom));
  pad.style.height=gap+'px';
}
function pageShell(body){
  const newBtn=F.pane==='setup'?`<button type="button" class="btn primary" onclick="toast('选稿页不新建任务')">新建任务</button>`:'';
  return `<div class="page-h"><div><div class="eyebrow">定时任务</div><h1>任务中心</h1><p>设置并监控定时图文生成：任务设置负责定时安排，任务监控负责执行记录。</p></div><span class="demo-chip">示例数据</span></div>
    <div class="lib-toolbar"><div class="lib-row">
      <div class="lib-kind" role="tablist" aria-label="任务分区">
        <button type="button" class="lib-pill ${F.pane==='setup'?'on':''}" onclick="setPane('setup')">定时任务设置</button>
        <button type="button" class="lib-pill ${F.pane==='monitor'?'on':''}" onclick="setPane('monitor')">任务监控</button>
      </div>${newBtn}
    </div></div>${body}`;
}
function groupByDateTask(list){
  const t=todayKey();
  const dates=[...new Set(list.map(dateKey))];
  dates.sort((a,b)=>{
    const ra=a===t?0:a>t?1:2, rb=b===t?0:b>t?1:2;
    if(ra!==rb) return ra-rb;
    if(ra===1) return a.localeCompare(b);
    if(ra===2) return b.localeCompare(a);
    return 0;
  });
  return dates.map(d=>{
    const rs=list.filter(r=>dateKey(r)===d).sort((a,b)=>timeOf(b).localeCompare(timeOf(a)));
    const names=[...new Set(rs.map(r=>r.name))];
    return {date:d,label:dateLabel(d),runs:rs,tasks:names.map(n=>({name:n,runs:rs.filter(r=>r.name===n)}))};
  });
}
function statsHTML(kind){
  const c=counts(todayRuns());
  const items=[['今日执行',c.all,'#1c5fc4'],['成功',c.成功,'#17734a'],['失败',c.失败,'#b3262f'],['运行中',c.运行中,'#1c5fc4'],['挂起',c.挂起,'#5c6570']];
  return `<div class="stats" aria-label="今日统计">${items.map(([k,v,col])=>`<div class="stat" style="--c:${col}"><span class="k">${k}</span><div class="v">${v}</div></div>`).join('')}</div>`;
}


function monitorHTML(){
  const list=filtered();
  const byTask=TASKS.map(t=>{
    const runs=list.filter(r=>r.taskId===t.id).sort((a,b)=>b.start.localeCompare(a.start));
    return {t,runs};
  }).filter(x=>F.q||F.status!=='全部'||F.from||F.to?x.runs.length:true);
  if(!byTask.length) return statsHTML()+filterBar()+'<div class="empty"><b>没有符合条件的任务</b>试试调整筛选</div>';
  const cards=byTask.map(({t,runs})=>{
    const open=F.open===t.id;
    const recent=runs.slice(0,6);
    const cells=recent.length?recent.map(r=>`<span class="cell ${STMAP[r.status]||'wait'}" title="${esc(r.start+' · '+r.status)}"></span>`).join(''):`<span class="faint">暂无执行</span>`;
    const hist=runs.length?groupByDateTask(runs).map(g=>`<div class="hday">${esc(g.label)}</div>`+g.runs.map(r=>`
      <div class="hrow">
        <div class="tm">${esc(timeOf(r))}</div>
        <div>${stBadge(r.status)}</div>
        <div>${outLink(r)}</div>
        ${ops(r)}
        ${r.note?`<div class="note">${esc(r.note)}</div>`:''}
      </div>`).join('')).join(''):`<div class="faint" style="padding:8px 0">该筛选下暂无执行记录</div>`;
    return `<article class="tcard ${open?'open':''}">
      <div class="thead">
        <div>
          <h3>${esc(t.name)}</h3>
          <div class="faint" style="margin-top:2px;font-size:12px">${esc(t.summary)}</div>
        </div>
        <span class="badge ${t.enabled?'on':'off'}">${t.enabled?'已启用':'已停用'}</span>
      </div>
      <div class="kv">
        <div><span class="k">执行周期</span><span class="v">${esc(t.cycle+' '+t.when)}</span></div>
        <div><span class="k">下次执行</span><span class="v">${esc(t.next)}</span></div>
      </div>
      <div class="recent"><span class="k">最近执行</span><div class="cells">${cells}</div>
        <button type="button" class="btn sm ghost" style="margin-left:auto" onclick="toggleCard('${t.id}')">${open?'收起历史':'展开历史'}</button>
      </div>
      <div class="hist">${hist}</div>
    </article>`;
  }).join('');
  return statsHTML()+filterBar()+`<div class="grid">${cards}</div>`;
}


function render(){
  const host=document.getElementById('pageHost');
  host.innerHTML=pageShell(F.pane==='monitor'?monitorHTML():setupHTML());
  document.getElementById('crumb').innerHTML='工作台 / <b>任务中心</b> / '+(F.pane==='monitor'?'任务监控':'定时任务设置');
  fitFill();
}
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go&&go.getAttribute('data-go')!=='tasks'){e.preventDefault();toast('本页为任务监控选稿，不跳转主原型');return}
  const t=e.target.closest('[data-toast]');
  if(t){toast(t.getAttribute('data-toast'))}
  if(e.target.closest('#ubtn')){
    const d=document.getElementById('udrop');
    const on=d.hidden;d.hidden=!on;document.getElementById('ubtn').setAttribute('aria-expanded',on?'true':'false');
  }else{
    const d=document.getElementById('udrop');if(d){d.hidden=true;document.getElementById('ubtn').setAttribute('aria-expanded','false')}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLog()});
window.addEventListener('resize',fitFill);
render();

</script>
</body>
</html>
