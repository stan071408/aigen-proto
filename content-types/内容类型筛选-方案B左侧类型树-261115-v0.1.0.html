<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIGenPlatform · 内容库类型筛选 · 方案B 左侧类型树 · 261115 v0.1.0</title>
<style>
:root{--accent:#1c5fc4;--accent-d:#164ea3;--bg:#f1f6fc;--paper:#fff;--ink:#14213a;--muted:#596579;--faint:#8592a6;--line:#d9e3f0;--line2:#e7eef7;--soft:#eef4fc;--soft2:#e6eef8;--shadow:0 10px 30px #12305c14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1180px;margin:0 auto;padding:20px 20px 28px}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
.eyebrow{font-size:10.5px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;font-weight:650}
.page-h h1{margin:3px 0 0;font-size:23px;letter-spacing:-.02em;line-height:1.25}
.page-h p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:12px;font:inherit;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.input{height:36px;padding:0 12px;border:2px solid #6b7c94;border-radius:12px;background:#fff;font:inherit;color:var(--ink);min-width:0}
.input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(28,95,196,.28)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;align-items:start}
.tree{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.tree-h{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px}
.tree-h b{font-size:12.5px}
.tree-h span{font-size:11px;color:var(--faint)}
.node{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;border-radius:9px;padding:6px 8px;font:inherit;color:#26344c;cursor:pointer;text-align:left}
.node:hover{background:#f5f9ff}
.node.on{background:#e3edfc;color:#17427f;font-weight:650}
.node .ic{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:#8592a6;flex:none}
.node .nm{flex:1;min-width:0;font-size:12.5px}
.node .ct{font-size:11px;color:var(--faint);flex:none}
.node.on .ct{color:#4a76b5}
.child{padding-left:20px}
.grand{padding-left:22px}
.grand .node{font-size:12px;color:#4a5568}
.grand .node.on{color:#17427f}
.bar{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lab{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:12px;color:#3c4c64;cursor:pointer;line-height:20px}
.chip.on{background:#e3edfc;border-color:#b7cdf0;color:#17427f;font-weight:600}
.search{display:flex;align-items:center;gap:8px;flex:1;min-width:200px}
.search .input{flex:1}
.grow{flex:1}
.hint{font-size:11.5px;color:var(--faint)}
.crumb{font-size:11.5px;color:var(--muted)}
.crumb b{color:#26344c}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-top:0;overflow:hidden;box-shadow:var(--shadow)}
.list-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbfdff}
.list-h b{font-size:13px}
.list-h span{font-size:11.5px;color:var(--faint)}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:#f8fbff}
.item .tt{min-width:0;flex:1}
.item .tt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tt small{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.tags{display:flex;gap:5px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.tag{font-size:11px;line-height:20px;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#4a5568;white-space:nowrap}
.tag.kind{background:#eef4fc;border-color:#cfe0f7;color:#1c5fc4;font-weight:600}
.tag.sub{background:#f6f8fb;color:#596579}
.tag.img{background:#f3f0fb;border-color:#ddd4f3;color:#5b45a8;font-weight:600}
.meta{font-size:11.5px;color:var(--faint);flex:none;text-align:right;min-width:96px}
.empty{padding:44px 20px;text-align:center;color:var(--faint);font-size:12.5px}
.empty b{display:block;font-size:13.5px;color:#596579;margin-bottom:4px}
.foot{margin-top:14px;font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="page">
  <div class="page-h">
    <div><div class="eyebrow">内容与产物</div><h1>内容库</h1><p>方案 B · 左侧类型树：大类 → 文章类型 → 具体稿型，点击即定位。</p></div>
    <div class="row"><button class="btn">导出</button><button class="btn primary">新建内容</button></div>
  </div>

  <div class="layout">
    <aside class="tree">
      <div class="tree-h"><b>内容类型</b><span>共 <span id="totalN">0</span> 项</span></div>
      <div id="tree"></div>
    </aside>

    <main>
      <div class="bar">
        <div class="row">
          <div class="search"><span class="hint">搜索</span><input class="input" id="q" placeholder="搜索标题、关键词"></div>
        </div>
        <div class="row">
          <span class="lab">来源</span>
          <div class="chips" id="srcs">
            <button class="chip on" data-src="all">全部来源</button>
            <button class="chip" data-src="主题生成">主题生成</button>
            <button class="chip" data-src="热榜生成">热榜生成</button>
          </div>
          <span class="grow"></span>
          <span class="crumb" id="crumb">—</span>
        </div>
      </div>

      <div class="list">
        <div class="list-h"><b>内容列表</b><span id="count">—</span></div>
        <div id="items"></div>
      </div>
    </main>
  </div>

  <div class="foot"><span>方案 B：类型树带计数，可逐级下钻；右侧保留搜索与来源筛选。</span><span id="footCount"></span></div>
</div>

<script>
const TYPES={text:['原稿','差异化稿','广度稿','深度稿','合并稿'],illus:['原图文稿','差异化图文稿','广度图文稿','深度图文稿','合并图文稿']};
const DATA=[
 {t:'社区食堂如何留住居民',kind:'article',at:'text',sub:'合并稿',src:'主题生成',d:'11-15 07:32',n:'1,842 字'},
 {t:'社区食堂如何留住居民',kind:'article',at:'text',sub:'原稿',src:'主题生成',d:'11-15 07:31',n:'1,120 字'},
 {t:'年轻人为什么开始重新关注社区生活',kind:'article',at:'text',sub:'深度稿',src:'热榜生成',d:'11-15 08:02',n:'1,960 字'},
 {t:'老旧小区加装电梯，居民最关心哪些问题',kind:'article',at:'text',sub:'差异化稿',src:'热榜生成',d:'11-14 09:20',n:'1,388 字'},
 {t:'城市绿道建成后，周边生活有哪些变化',kind:'article',at:'text',sub:'广度稿',src:'热榜生成',d:'11-14 10:05',n:'1,510 字'},
 {t:'三国野史里最被低估的五场战役',kind:'article',at:'text',sub:'原稿',src:'主题生成',d:'11-13 07:30',n:'1,236 字'},
 {t:'社区食堂如何留住居民',kind:'article',at:'illus',sub:'合并图文稿',src:'主题生成',d:'11-15 07:32',n:'封面 1 + 配图 5'},
 {t:'社区食堂如何留住居民',kind:'article',at:'illus',sub:'原图文稿',src:'主题生成',d:'11-15 07:31',n:'封面 1 + 配图 5'},
 {t:'年轻人为什么开始重新关注社区生活',kind:'article',at:'illus',sub:'深度图文稿',src:'热榜生成',d:'11-15 08:02',n:'封面 1 + 配图 5'},
 {t:'老旧小区加装电梯，居民最关心哪些问题',kind:'article',at:'illus',sub:'差异化图文稿',src:'热榜生成',d:'11-14 09:20',n:'封面 1 + 配图 4'},
 {t:'城市绿道建成后，周边生活有哪些变化',kind:'article',at:'illus',sub:'广度图文稿',src:'热榜生成',d:'11-14 10:05',n:'封面 1 + 配图 5'},
 {t:'社区食堂配图 01',kind:'image',at:'',sub:'',src:'主题生成',d:'11-15 07:32',n:'1080 × 720'},
 {t:'社区食堂封面',kind:'image',at:'',sub:'',src:'主题生成',d:'11-15 07:31',n:'1080 × 1440'},
 {t:'老旧小区电梯配图 02',kind:'image',at:'',sub:'',src:'热榜生成',d:'11-14 09:21',n:'1080 × 720'}
];
const S={node:'all',src:'all',q:''};
const el=s=>document.querySelector(s);
const base=()=>DATA.filter(x=>!S.q.trim()||x.t.includes(S.q.trim()));
function countNode(kind,at,sub){
  return base().filter(x=>{
    if(kind==='article'&&x.kind!=='article')return false;
    if(kind==='image'&&x.kind!=='image')return false;
    if(at&&x.at!==at)return false;
    if(sub&&x.sub!==sub)return false;
    return true;
  }).length;
}
function treeHTML(){
  const n0=countNode(null,null,null);
  let h=`<button class="node ${S.node==='all'?'on':''}" data-n="all"><span class="ic">▤</span><span class="nm">全部内容</span><span class="ct">${n0}</span></button>`;
  h+=`<button class="node ${S.node==='article'?'on':''}" data-n="article"><span class="ic">✎</span><span class="nm">文章</span><span class="ct">${countNode('article',null,null)}</span></button>`;
  h+=`<div class="child">`;
  h+=`<button class="node ${S.node==='article:text'?'on':''}" data-n="article:text"><span class="ic">≡</span><span class="nm">纯文字稿</span><span class="ct">${countNode('article','text',null)}</span></button>`;
  h+=`<div class="grand">`+TYPES.text.map(t=>`<button class="node ${S.node==='article:text:'+t?'on':''}" data-n="article:text:${t}"><span class="nm">${t}</span><span class="ct">${countNode('article','text',t)}</span></button>`).join('')+`</div>`;
  h+=`<button class="node ${S.node==='article:illus'?'on':''}" data-n="article:illus"><span class="ic">▣</span><span class="nm">图文稿</span><span class="ct">${countNode('article','illus',null)}</span></button>`;
  h+=`<div class="grand">`+TYPES.illus.map(t=>`<button class="node ${S.node==='article:illus:'+t?'on':''}" data-n="article:illus:${t}"><span class="nm">${t}</span><span class="ct">${countNode('article','illus',t)}</span></button>`).join('')+`</div>`;
  h+=`</div>`;
  h+=`<button class="node ${S.node==='image'?'on':''}" data-n="image"><span class="ic">▢</span><span class="nm">图片</span><span class="ct">${countNode('image',null,null)}</span></button>`;
  return h;
}
function allowed(x){
  const parts=S.node.split(':');
  if(parts[0]==='article'&&x.kind!=='article')return false;
  if(parts[0]==='image'&&x.kind!=='image')return false;
  if(parts[1]&&x.at!==parts[1])return false;
  if(parts[2]&&x.sub!==parts[2])return false;
  if(S.src!=='all'&&x.src!==S.src)return false;
  if(S.q.trim()&&!x.t.includes(S.q.trim()))return false;
  return true;
}
function crumbText(){
  const p=S.node.split(':');
  if(p[0]==='all')return '全部内容';
  if(p[0]==='image')return '图片';
  const at=p[1]==='text'?'纯文字稿':'图文稿';
  return '文章 › '+at+(p[2]?' › '+p[2]:'');
}
function paint(){
  el('#tree').innerHTML=treeHTML();
  el('#totalN').textContent=DATA.length;
  const rows=DATA.filter(allowed);
  el('#items').innerHTML=rows.length?rows.map(x=>{
    const tags=x.kind==='image'?'<span class="tag img">图片</span>':`<span class="tag kind">文章</span><span class="tag sub">${x.at==='text'?'纯文字稿':'图文稿'}</span><span class="tag sub">${x.sub}</span>`;
    return `<div class="item"><div class="tt"><b>${x.t}</b><small>${x.src} · ${x.d}</small></div><div class="tags">${tags}</div><div class="meta">${x.n}</div></div>`;
  }).join(''):`<div class="empty"><b>没有符合条件的内容</b>换个类型或清空搜索再试。</div>`;
  el('#count').textContent=`共 ${rows.length} 项`;
  el('#crumb').innerHTML='当前：<b>'+crumbText()+'</b>';
  el('#footCount').textContent='当前：'+crumbText();
}
el('#tree').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;S.node=b.dataset.n;paint()});
document.querySelectorAll('#srcs .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#srcs .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.src=b.dataset.src;paint()});
el('#q').addEventListener('input',e=>{S.q=e.target.value;paint()});
paint();
</script>
</body>
</html>
