}
function toast(msg){const n=document.getElementById('toast');n.textContent=msg;n.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.style.display='none',3500)}
function dialog(key,scope){dialogOrigin=current;exportScope=scope||'one';const shade=document.createElement('div');shade.className='modal-shade';shade.setAttribute('role','dialog');shade.setAttribute('aria-modal','true');shade.append(render(cache.get(key)));if(key==='exportDialog'){const t=shade.querySelector('[data-name="选择导出格式与保存位置 · 共 3 稿"]');const count=resultDirections.length;if(t)t.textContent='选择导出格式与保存位置 · 共 '+(scope==='all'?count:1)+' 稿';const dir=shade.querySelector('input:not([type=radio])');if(dir)dir.value=localStorage.getItem('windows-design-export-dir')||'系统桌面';shade.querySelectorAll('input[type=radio]').forEach((n,i)=>n.checked=(i===0)===(format==='docx'))}else{const title=shade.querySelector('[data-name="'+TITLES[0]+'"]');if(title)title.textContent=TITLES[selected[isMergedView()?'merged':tab]];const b=shade.querySelector('.badge');if(b)b.textContent=isMergedView()?'三稿合并稿':{similarity:'差异化稿',breadth:'广度稿',depth:'深度稿'}[tab]}document.body.append(shade);shade.querySelector('input,button')?.focus()}
function closeDialog(){document.querySelector('.modal-shade')?.remove();document.querySelector('[data-action="exportOne"]')?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();const modal=document.querySelector('.modal-shade');if(modal&&e.key==='Tab'){const fields=[...modal.querySelectorAll('button,input')].filter(n=>!n.disabled);if(e.shiftKey&&document.activeElement===fields[0]){e.preventDefault();fields.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===fields.at(-1)){e.preventDefault();fields[0]?.focus()}}});
function act(action,node){
 if(action==='fetchTopics'){const input=document.querySelector('[data-name="榜单数量"]');requestedTopicCount=Math.max(1,Math.min(50,Math.floor(Number(input?.value))||DEFAULT_TOPIC_COUNT));visibleTopicCount=Math.min(requestedTopicCount,BOARD_TOPICS.length);if(selectedTopic===null||selectedTopic>=visibleTopicCount)selectedTopic=0;addBoardLog('开始获取榜单数据（原型演示），请求 '+requestedTopicCount+' 条。');addBoardLog('已读取本地榜单示例，分类、热门值及采集时间已就绪。');addBoardLog('获取完成，共展示 '+visibleTopicCount+' 条榜单数据。');show('step1');if(requestedTopicCount>BOARD_TOPICS.length)toast('原型提供 10 条示例数据，已展示全部可用数据。');return}
 if(action==='empty1'){visibleTopicCount=0;selectedTopic=null;addBoardLog('已清空当前榜单结果。');show('step1');return}
 if(action.startsWith('candidate:')){selected[isMergedView()?'merged':tab]=Number(action.split(':')[1]);updateTitles();return}
 if(action.startsWith('tab:')){tab=action.split(':')[1];show(resultScene,true);return}
 if(action.startsWith('direction')){const i=Number(action.slice(-1));direction[i]=!direction[i];const c=node.querySelector('input');if(c)c.checked=direction[i];const panel=node.closest('[data-name="差异化稿"],[data-name="广度稿"],[data-name="深度稿"]');if(panel){panel.style.background=T[direction[i]?'accentSoft':'surface'];panel.style.borderColor=T[direction[i]?'accent':'border']}updateTitles();return}
 if(action.startsWith('idea')){
  idea=Number(action.slice(-1));const destination=resetReturn||'step3';resetReturn=null;show(destination);
  const content=document.querySelector('[data-name="当前步骤工作区"]'),heading=content?.querySelector('.text');
  if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}
  window.scrollTo({top:0,behavior:'instant'});toast('立意已选择，写作风格保留');return;
 }
 if(action.startsWith('style')){
  const scrollTop=document.querySelector('[data-name="当前步骤工作区"]')?.scrollTop||0;
  style=Number(action.slice(-1));const destination=resetReturn||'step3';show(destination);resetReturn=null;
  if(destination==='step3'){document.querySelector('[data-name="当前步骤工作区"]').scrollTop=scrollTop;document.querySelector('.style-card.selected input')?.focus({preventScroll:true})}
  toast('写作风格已选择');return;
 }
 if(action==='exportOne'||action==='exportMerged'){pendingHandoff=false;dialog('exportDialog','one');return}if(action==='exportAll'){pendingHandoff=false;dialog('exportDialog','all');return}
 if(action==='illustrate'){pendingHandoff=true;dialog('exportDialog','one');return}
 if(action==='handoff'){if(illustrationArticle)show('illustration');else toast('请先在文章处理页点击“生成图文稿”导入一篇文章。');return}
 if(action==='returnArticle'){show(illustrationArticle?.origin||resultScene,true);return}
 if(action==='startIllustration'){toast('原型演示：已确认当前单篇图文任务；正式版由图文流水线执行。');return}
 if(action==='close'){pendingHandoff=false;closeDialog();return}
 if(action==='formatDocx'||action==='formatMd'){format=action==='formatDocx'?'docx':'md';document.querySelectorAll('.modal-shade input[type=radio]').forEach((n,i)=>n.checked=(i===0)===(format==='docx'));return}
 if(action==='chooseDirectory'){const n=document.querySelector('.modal-shade input:not([type=radio])');if(n){n.readOnly=false;n.focus();n.select();toast('设计示例：输入目录名称以验证目录记忆；正式版使用系统文件夹选择器。')}return}
 if(action==='confirmExport'){
  const dir=document.querySelector('.modal-shade input:not([type=radio])')?.value.trim()||'系统桌面';localStorage.setItem('windows-design-export-dir',dir);
  if(pendingHandoff){
   const title=TITLES[selected[isMergedView()?'merged':tab]],filename=title.replace(/[<>:"/\\|?*\x00-\x1f]/g,'_')+'.'+format;
   illustrationArticle={title,direction:isMergedView()?'三稿合并稿':DIRECTION_NAMES[tab],origin:isMergedView()?'step6':resultScene,path:dir.replace(/[\\/]$/,'')+'\\'+filename};
   closeDialog();pendingHandoff=false;show('illustration');toast('原型演示：已导出本稿并导入图文任务，请确认后手动开始。');
  }else{closeDialog();toast('设计示例：'+(exportScope==='all'?'全部稿件':'当前稿件')+'将以 .'+format+' 保存到 '+dir)}return;
 }
 if(action==='confirmHandoff'){closeDialog();pendingHandoff=true;dialog('exportDialog','one');return}
 if(action==='sourceTitle'||action==='sourceSaved'){source=action==='sourceTitle'?'title':'saved';document.querySelectorAll('[data-name="风格获取设置"] input[type=radio]').forEach((n,i)=>n.checked=(i===0)===(source==='title'));return}
 if(action==='preview5'){lastScene=current;show('preview5');return}
 if(action==='step5'&&current==='preview5'){show(lastScene==='step6'?'step6':resultScene,true);return}
 if(action==='running4'&&['step4','compact4'].includes(current)){resultDirections=['similarity','breadth','depth'].filter((_,i)=>direction[i]);if(!resultDirections.length)return;generatedDirections=[];generationPending=true;show('running4');return}
 if(action==='step5'&&current==='running4'&&generationPending){toast('请等待稿件生成完成，将自动进入第五步。');return}
 if(action==='step5'&&generatedDirections.length){show(resultScene,true);return}
 if(action==='topic'){toast('原标题已选择，可继续提炼立意');return}
 if(action==='favorite'){toast('常用风格最多 5 个，已保留当前设置');return}
 if(action==='history'){toast('历史任务：支持恢复中断任务与查看旧稿版本');return}
 if(action==='empty1'||action==='empty2'){toast('清空当前结果及下游选择；保留风格库');return}
 if((action==='step2'||action==='step3')&&['step4','compact4'].includes(current)&&node.textContent==='重新设定')resetReturn=current;
 if(cache.has(action)){show(action);return}toast('此入口为设计说明，生产业务保持独立');
}
// Only the local comparison page may replay completed-step sample transitions.
if(new URLSearchParams(location.search).get('motionPreview')==='1'){
 let motionReplayFrame=null;
 addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==parent||parent===window||event.data?.type!=='preview-step-motion')return;
  const pair={topic:['step1','step2'],idea:['step2','step3'],style:['step3','step4'],draft:['step4','step5'],merge:['step5','step6']}[event.data.scenario];
  if(!pair)return;
  cancelAnimationFrame(motionReplayFrame);
  if(['draft','merge'].includes(event.data.scenario))generatedDirections=['similarity','breadth','depth'];
  window.hotArticleMotion?.reset();show(pair[0]);
  motionReplayFrame=requestAnimationFrame(()=>{motionReplayFrame=requestAnimationFrame(()=>show(pair[1]))});
 });
}
const initialScene=new URLSearchParams(location.search).get('scene');
// Explicit result URLs load completed sample scenarios; normal entry starts without results.
if(['step5','breadth5','depth5','preview5','merging5','step6'].includes(initialScene))generatedDirections=['similarity','breadth','depth'];
if(['dual5','partial5'].includes(initialScene))generatedDirections=['similarity','breadth'];
if(initialScene==='single5')generatedDirections=['similarity'];
show(cache.has(initialScene)?initialScene:'step4');
</script></body></html>
